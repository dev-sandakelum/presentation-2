<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Slidesmith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ============ EDITOR CHROME STYLES (not exported) ============ -->
<style id="app-css">
:root{
  --ink:#e9eefb; --mut:#8a94ac; --tx2:#c9d4ee; --tx3:#aab6cf;
  --panel:#0d1322; --panel2:#0b101d; --line:rgba(148,180,255,.13);
  --hov:rgba(160,190,255,.08); --hovline:rgba(148,180,255,.45);
  --pop:#111a2e; --chipbg:rgba(10,17,30,.85); --thumbbg:#070b16;
  --bg0:#070c17; --txarea:#c6d0e8; --scr:rgba(148,180,255,.16);
  --danger:#ff9d9d; --veil:rgba(3,7,15,.74);
  --frame-sh:0 30px 90px -30px rgba(0,0,0,.75),0 0 0 1px rgba(148,180,255,.14);
  --acc:#3fe0c0; --acc2:#4da8ff;
  --fd:'Space Grotesk',sans-serif; --fb:'Instrument Sans',sans-serif; --fm:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
/* ---- LIGHT EDITOR THEME ---- */
body.lite{
  --ink:#1b2437; --mut:#5c6884; --tx2:#33405c; --tx3:#5a6780;
  --panel:#ffffff; --panel2:#f2f4fa; --line:rgba(28,55,120,.14);
  --hov:rgba(35,80,190,.07); --hovline:rgba(35,80,190,.4);
  --pop:#ffffff; --chipbg:rgba(255,255,255,.92); --thumbbg:#e9edf6;
  --bg0:#e6eaf3; --txarea:#2c3a57; --scr:rgba(28,55,120,.22);
  --danger:#d64545; --veil:rgba(25,40,75,.38);
  --frame-sh:0 24px 70px -28px rgba(30,50,100,.35),0 0 0 1px rgba(28,55,120,.12);
}
body.lite{background:var(--bg0);color:var(--ink)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;min-width:1024px}

/* ---- top bar ---- */
.bar{height:54px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:700 15px var(--fd);letter-spacing:-.01em}
.brand small{font:500 9px var(--fm);letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.divi{width:1px;height:20px;background:var(--line);flex:none}
.b-mid{display:flex;align-items:center;gap:10px;min-width:0}
#deckTitle{background:none;border:0;border-bottom:1px dashed transparent;color:var(--ink);
  font:600 14px var(--fd);padding:5px 2px;width:280px;transition:border-color .2s}
#deckTitle:hover{border-bottom-color:var(--hovline)}
#deckTitle:focus{outline:0;border-bottom-color:var(--acc)}
.saved{display:inline-flex;align-items:center;gap:6px;font:500 9.5px var(--fm);letter-spacing:.2em;
  text-transform:uppercase;color:var(--mut);flex:none}
.saved i{width:6px;height:6px;border-radius:50%;background:var(--mut);transition:.3s}
.saved.go i{background:var(--acc);box-shadow:0 0 10px var(--acc);animation:sv .9s ease}
.saved.go{color:var(--ink)}
@keyframes sv{30%{transform:scale(1.7)}}
.b-acts{margin-left:auto;display:flex;align-items:center;gap:6px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;
  border:1px solid transparent;background:none;color:var(--tx3);cursor:pointer;transition:.18s;flex:none}
.ib:hover{background:var(--hov);color:var(--ink)}
.ib:disabled{opacity:.3;pointer-events:none}
.ib.on{color:var(--acc);background:rgba(63,224,192,.09);border-color:rgba(63,224,192,.3)}
.ib.danger:hover{color:var(--danger);background:rgba(255,120,120,.09)}
#btnPresent{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 15px;margin-left:6px;border:0;
  border-radius:9px;background:var(--acc);color:#052b23;font:600 13px var(--fd);cursor:pointer;transition:.18s}
#btnPresent:hover{filter:brightness(1.1)}
#btnPresent:active{transform:scale(.97)}

/* ---- body layout ---- */
.main{flex:1;display:flex;min-height:0}

/* ---- filmstrip ---- */
#strip{width:246px;flex:none;display:flex;flex-direction:column;background:var(--panel2);
  border-right:1px solid var(--line);user-select:none}
.s-head{flex:none;display:flex;align-items:baseline;gap:8px;padding:12px 16px 8px;
  font:600 9.5px var(--fm);letter-spacing:.26em;text-transform:uppercase;color:var(--mut)}
.s-head b{font:500 10px var(--fm);color:var(--tx2)}
.s-list{flex:1;overflow-y:auto;position:relative;padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px}
.s-list::-webkit-scrollbar{width:8px}
.s-list::-webkit-scrollbar-thumb{background:var(--scr);border-radius:8px}
.t-item{position:relative;flex:none}
.t-thumb{position:relative;display:block;width:218px;height:123px;border-radius:10px;overflow:hidden;
  border:1px solid var(--line);background:var(--thumbbg);cursor:grab;transition:border-color .2s,box-shadow .2s}
.t-item:hover .t-thumb{border-color:var(--hovline)}
.t-item.sel .t-thumb{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 8px 26px -10px rgba(63,224,192,.5)}
.t-item.lift{opacity:.25}
.mini{position:absolute;inset:0}
.mini .stage{transform:scale(.1703125);transform-origin:0 0;position:absolute;top:0;left:0}
.t-num{position:absolute;top:6px;left:6px;z-index:3;min-width:20px;height:20px;display:grid;place-items:center;
  padding:0 5px;border-radius:7px;background:var(--chipbg);font:600 10px var(--fm);color:var(--mut)}
.t-item.sel .t-num{background:var(--acc);color:#052b23}
.t-acts{position:absolute;top:6px;right:6px;z-index:3;display:flex;gap:4px;opacity:0;transition:.18s}
.t-item:hover .t-acts{opacity:1}
.ta{width:24px;height:24px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line);
  background:var(--chipbg);color:var(--tx2);cursor:pointer;transition:.15s}
.ta:hover{color:var(--ink);border-color:var(--hovline)}
.ta.del:hover{color:var(--danger);border-color:var(--danger)}
#addBtn{flex:none;margin:10px 14px 14px;height:42px;display:flex;align-items:center;justify-content:center;gap:9px;
  border:1.5px dashed rgba(148,180,255,.3);border-radius:11px;background:none;color:var(--mut);
  font:600 13px var(--fd);cursor:pointer;transition:.2s}
body.lite #addBtn{border-color:rgba(28,55,120,.3)}
#addBtn:hover{border-color:var(--acc);color:var(--ink);background:rgba(63,224,192,.05)}
.dropline{position:absolute;left:12px;right:12px;height:3px;border-radius:3px;background:var(--acc);
  box-shadow:0 0 14px rgba(63,224,192,.75);z-index:6;pointer-events:none}
.drag-ghost{position:fixed;z-index:600;width:218px;height:123px;pointer-events:none;border-radius:10px;overflow:hidden;
  border:1px solid rgba(63,224,192,.65);box-shadow:0 26px 55px -14px rgba(0,0,0,.7);transform:rotate(2.5deg);background:var(--thumbbg)}
.drag-ghost .mini{background:var(--thumbbg)}
body.noselect{user-select:none}

/* ---- context strip ---- */
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#ctx{flex:none;height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--line);user-select:none}
.c-num{font:500 11px var(--fm);color:var(--mut);letter-spacing:.08em;white-space:nowrap}
.c-num b{color:var(--acc);font-weight:600}
#cLayout,#btnLayers{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:9px;
  border:1px solid var(--line);background:none;color:var(--tx2);font:600 12px var(--fd);cursor:pointer;transition:.18s}
#cLayout:hover,#btnLayers:hover{border-color:var(--hovline);color:var(--ink)}
#cLayout .ic,#btnLayers .ic{color:var(--mut)}
.seg{display:inline-flex;height:30px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{height:100%;padding:0 12px;border:0;background:none;color:var(--mut);font:600 11.5px var(--fd);cursor:pointer;transition:.15s}
.seg button:hover{color:var(--tx2)}
.seg button.on{background:var(--hov);color:var(--acc)}
.c-accents{display:flex;align-items:center;gap:8px}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.16);cursor:pointer;padding:0;transition:.15s}
body.lite .sw{border-color:rgba(0,0,0,.18)}
.sw:hover{transform:scale(1.15)}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--acc)}
.ctx-acts{margin-left:auto;display:flex;gap:6px}
#center.no-notes #notesPane{display:none}

/* ---- canvas ---- */
#canvas{flex:1;position:relative;overflow:hidden;min-height:0;background:var(--bg0)}
.e-frame{position:absolute;border-radius:16px;overflow:hidden;background:var(--thumbbg);box-shadow:var(--frame-sh)}
#stageHost{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0}
.zoom{position:absolute;right:14px;bottom:12px;z-index:2;font:500 10.5px var(--fm);color:var(--mut);
  letter-spacing:.1em;padding:5px 9px;border:1px solid var(--line);border-radius:99px;background:var(--chipbg)}
.ehint{position:absolute;left:14px;bottom:12px;z-index:2;display:flex;align-items:center;gap:10px;
  font:500 10.5px var(--fm);letter-spacing:.08em;color:var(--mut);padding:6px 8px 6px 13px;border-radius:99px;
  border:1px solid var(--line);background:var(--chipbg);max-width:min(640px,66%)}
.ehint button{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:0;background:none;
  color:var(--mut);cursor:pointer;flex:none}
.ehint button:hover{color:var(--ink);background:var(--hov)}

/* ---- bottom pane: notes + code editors ---- */
#notesPane{flex:none;height:118px;display:flex;flex-direction:column;border-top:1px solid var(--line);
  background:var(--panel2);transition:height .25s var(--ease)}
#notesPane.mode-code,#notesPane.mode-bg,#notesPane.mode-so{height:242px}
.n-head{flex:none;display:flex;align-items:center;gap:12px;padding:7px 16px 3px}
.n-tabs{display:flex;gap:2px}
.n-tab{height:24px;padding:0 11px;border-radius:8px;border:0;background:none;color:var(--mut);cursor:pointer;
  font:600 9.5px var(--fm);letter-spacing:.22em;text-transform:uppercase;transition:.15s}
.n-tab:hover{color:var(--tx2)}
.n-tab.on{color:var(--acc);background:var(--hov)}
#notesPane:not(.has-code) .n-tab[data-p="code"]{display:none}
#notesPane:not(.has-bg) .n-tab[data-p="bg"]{display:none}
/* one Overlay tab — always visible; scope (this slide / all slides) is switched inside it */
.so-scope{display:none;gap:3px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--hov)}
#notesPane.mode-so .so-scope{display:flex}
.so-scope button{height:22px;padding:0 11px;border:0;border-radius:6px;background:none;color:var(--mut);cursor:pointer;
  font:600 9px var(--fm);letter-spacing:.14em;text-transform:uppercase;transition:.15s}
.so-scope button:hover{color:var(--tx2)}
.so-scope button.on{background:var(--panel);color:var(--acc);box-shadow:0 0 0 1px var(--line)}
.n-head em{font:500 9.5px var(--fm);font-style:normal;letter-spacing:.1em;color:var(--mut);margin-left:auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-mini{flex:none;height:22px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:none;
  color:var(--mut);font:500 9.5px var(--fm);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.15s}
.n-mini:hover{color:var(--acc);border-color:var(--acc)}
#notesPane:not(.mode-code):not(.mode-bg):not(.mode-so) .n-mini{display:none}
#notesTa,#codeTa,#ovTa,#bgTa,#soTa{flex:1;resize:none;border:0;background:none;color:var(--txarea);padding:5px 16px 12px;
  font:400 13px/1.6 var(--fb)}
#notesTa:focus,#codeTa:focus,#ovTa:focus,#bgTa:focus,#soTa:focus{outline:0}
#codeTa,#ovTa,#bgTa,#soTa{display:none;font:400 12.5px/1.7 var(--fm);tab-size:2;white-space:pre-wrap;caret-color:var(--acc)}
#notesPane.mode-code #codeTa{display:block}
#notesPane.mode-bg #bgTa{display:block}
#notesPane.mode-so #soTa{display:block}
#notesPane.mode-so.so-deck #soTa{display:none}
#notesPane.mode-so.so-deck #ovTa{display:block}
#notesPane.mode-code #notesTa,#notesPane.mode-bg #notesTa,#notesPane.mode-so #notesTa{display:none}

/* ---- toasts ---- */
#toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:700;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:var(--pop);border:1px solid var(--line);
  padding:10px 16px;border-radius:12px;color:var(--ink);font:500 13px var(--fb);
  box-shadow:0 18px 44px -14px rgba(0,0,0,.7);animation:tin .32s var(--ease)}
body.lite .toast{box-shadow:0 18px 44px -14px rgba(30,50,100,.35)}
.toast .ic{color:var(--acc);flex:none}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}

/* ---- popover ---- */
#pop{position:fixed;z-index:650;background:var(--pop);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 30px 70px -20px rgba(0,0,0,.7);animation:poin .18s var(--ease)}
body.lite #pop{box-shadow:0 30px 70px -20px rgba(30,50,100,.4)}
@keyframes poin{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.pk-grid{display:grid;grid-template-columns:repeat(2,150px);gap:6px;padding:8px}
.pk{display:flex;flex-direction:column;align-items:center;gap:9px;padding:13px 8px 11px;border-radius:12px;
  border:1px solid transparent;background:none;cursor:pointer;text-align:center}
.pk:hover{background:var(--hov);border-color:var(--line)}
.pk b{font:600 12.5px var(--fd);color:var(--ink)}
.pk small{font:400 10px var(--fb);color:var(--mut);margin-top:-4px}
.sch{width:104px;height:62px;background:var(--thumbbg);border:1px solid var(--line);border-radius:9px;
  display:flex;flex-direction:column;justify-content:center;gap:5px;padding:10px;align-items:flex-start}
.sch.c{align-items:center}
.sch u{display:block;width:30px;height:4px;border-radius:2px;background:var(--hovline)}
.sch u.sa{width:18px;height:3px;background:linear-gradient(90deg,#4da8ff,#9b8cff)}
.sch .row{display:flex;align-items:center;gap:5px}
.sch .row b{width:5px;height:5px;border-radius:50%;background:#4da8ff;flex:none}
.sch .g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%}
.sch .g u{height:13px;border:1px solid var(--hovline);background:none;width:auto}
.sch .qm{font:700 17px var(--fd);color:#4da8ff;line-height:1;height:17px}
.lm-list{display:flex;flex-direction:column;gap:2px;padding:7px;min-width:236px}
.lm{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;border:0;
  background:none;color:var(--tx2);font:500 13px var(--fd);cursor:pointer;text-align:left}
.lm:hover{background:var(--hov);color:var(--ink)}
.lm .chk{margin-left:auto;color:var(--acc)}
.lm.cur{color:var(--ink)}
.mx{display:flex;align-items:center;gap:13px;width:290px;padding:11px 13px;border-radius:11px;border:0;
  background:none;cursor:pointer;text-align:left}
.mx:hover{background:var(--hov)}
.mx .ic{color:var(--acc);flex:none}
.mx b{display:block;font:600 13px var(--fd);color:var(--ink)}
.mx small{display:block;font:400 11px var(--fb);color:var(--mut);margin-top:2px}

/* ---- overlay settings panel ---- */
.ovp{width:316px;padding:14px}
.ovp-top{display:flex;align-items:flex-start;gap:12px}
.ovp-top b{font:600 13.5px var(--fd);color:var(--ink);display:block}
.ovp-top small{display:block;font:400 11px/1.5 var(--fb);color:var(--mut);margin-top:3px}
.sw-tgl{position:relative;width:38px;height:22px;flex:none;margin-top:2px;border-radius:99px;
  border:1px solid var(--line);background:var(--hov);cursor:pointer;padding:0;transition:.2s}
.sw-tgl::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;
  background:var(--mut);transition:.22s var(--ease)}
.sw-tgl.on{background:rgba(63,224,192,.22);border-color:var(--acc)}
.sw-tgl.on::after{left:19px;background:var(--acc)}
#ovBody.off *{opacity:.45;pointer-events:none}
.ovp label{display:block;font:600 9.5px var(--fm);letter-spacing:.22em;text-transform:uppercase;
  color:var(--mut);margin:13px 0 7px}
.ovp label em{font:500 9px var(--fm);font-style:normal;letter-spacing:.08em;text-transform:none;opacity:.85}
.ovp .ovp-inp{width:100%;height:34px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--ink);
  font:500 12.5px var(--fb);padding:0 11px;transition:border-color .15s}
.ovp .ovp-inp:focus{outline:0;border-color:var(--acc)}
.ovp-styles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ovst{display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 4px 8px;border-radius:10px;
  border:1px solid transparent;background:none;cursor:pointer;transition:.15s}
.ovst:hover{background:var(--hov)}
.ovst.on{border-color:var(--acc);background:rgba(63,224,192,.07)}
.ovst b{font:600 11.5px var(--fd);color:var(--ink)}
.ov-prev{width:64px;height:40px;border:1px solid var(--line);border-radius:7px;position:relative;
  background:var(--thumbbg);overflow:hidden}
.ov-prev i{position:absolute;background:var(--acc);opacity:.85}
.ov-prev .c{width:24px;height:6px;right:5px;bottom:5px;border-radius:3px}
.ov-prev .bb{left:0;right:0;bottom:0;height:9px}
.ov-prev .w{left:-14px;right:-14px;top:16px;height:5px;transform:rotate(-18deg);border-radius:3px}
.ov-prev .ip{position:absolute;inset:9px;border:1px dashed rgba(120,170,255,.5);border-radius:6px;opacity:1;
  background:linear-gradient(135deg,rgba(77,168,255,.16),rgba(155,140,255,.1))}
.ov-prev .hp{position:absolute;inset:9px;border:1px solid rgba(120,170,255,.45);border-radius:6px;opacity:1;background:none}
.ov-prev .hp::after{content:"</>";position:absolute;inset:0;display:grid;place-items:center;
  font:600 10px var(--fm);color:var(--acc)}
.ovp-pos{display:grid;grid-template-columns:repeat(2,60px);grid-auto-rows:34px;gap:6px}
.ovpos{border:1px solid var(--line);border-radius:9px;background:none;cursor:pointer;position:relative;transition:.15s}
.ovpos:hover{background:var(--hov)}
.ovpos::after{content:"";position:absolute;width:10px;height:10px;border-radius:3px;background:var(--hovline)}
.ovpos[data-p="tl"]::after{top:6px;left:6px}
.ovpos[data-p="tr"]::after{top:6px;right:6px}
.ovpos[data-p="bl"]::after{bottom:6px;left:6px}
.ovpos[data-p="br"]::after{bottom:6px;right:6px}
.ovpos.on{border-color:var(--acc)}
.ovpos.on::after{background:var(--acc)}
.ovp-row{display:flex;gap:6px;margin-top:2px}
.ovp-row .n-mini{height:26px}
.ovp input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;border-radius:4px;
  background:var(--scr);outline:none;margin:4px 0 2px;cursor:pointer}
.ovp input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--acc);cursor:pointer;border:2px solid var(--panel2);box-shadow:0 0 8px rgba(63,224,192,.5)}
.ovp input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--acc);border:0;cursor:pointer}
.ovp-foot{margin-top:12px;font:400 10.5px/1.5 var(--fb);color:var(--mut)}
.sec-off{display:none!important}

/* ---- modal ---- */
.mo-back{position:fixed;inset:0;z-index:800;background:var(--veil);display:flex;align-items:center;
  justify-content:center;animation:fin .2s}
@keyframes fin{from{opacity:0}}
.mo{width:440px;max-width:92vw;background:var(--pop);border:1px solid var(--line);border-radius:18px;
  padding:26px;animation:moin .24s var(--ease)}
@keyframes moin{from{opacity:0;transform:scale(.95) translateY(10px)}}
.mo h3{margin:0 0 10px;font:700 17px var(--fd);letter-spacing:-.01em}
.mo p{margin:0 0 22px;font:400 13.5px/1.65 var(--fb);color:var(--mut)}
.mo-acts{display:flex;justify-content:flex-end;gap:10px}
.btn{height:34px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--tx2);
  font:600 13px var(--fd);cursor:pointer;transition:.18s}

<script>
'use strict';
/* ================= helpers ================= */

const uid=()=>Math.random().toString(36).slice(2,9);

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const IC={

  undo:'<path d="M4 10h10a5 5 0 0 1 0 10h-4"/><path d="M8 6 4 10l4 4"/>',
  redo:'<path d="M20 10H10a5 5 0 0 0 0 10h4"/><path d="m16 6 4 4-4 4"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  note:'<path d="M5 5h14M5 10h14M5 15h8"/>',
  left:'<path d="M19 12H5m0 0 6-6m-6 6 6 6"/>',
  right:'<path d="M5 12h14m0 0-6-6m6 6-6 6"/>',
  check:'<path d="m5 13 4 4L19 7"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>',
  moon:'<path d="M20.6 13.4A8.4 8.4 0 1 1 10.6 3.4a6.6 6.6 0 0 0 10 10z"/>',
  copyr:'<circle cx="12" cy="12" r="8.5"/><path d="M14.7 9.6a3.7 3.7 0 1 0 0 4.8"/>',

};

/* ================= constants ================= */
const LS='slidesmith.v1';
const LAYOUTS={
  title:{name:'Title',hint:'Big opening slide'},

const ACCENTS=[
  ['#4da8ff','#9b8cff'],['#9d8cff','#6ec9ff'],['#3fe0c0','#4da8ff'],

const accent2=a=>{const p=ACCENTS.find(x=>x[0]===a);return p?p[1]:'#9b8cff'};
const BGFX=`<div class="bgfx" aria-hidden="true"><span class="b b1"></span><span class="b b2"></span><span class="b b3"></span><span class="glines"></span><span class="vig"></span></div>`;
const FONT_HREF='https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap';

/* starter code for full-page HTML slides — 100% self-contained, the app adds NOTHING */
const CUSTOM_TPL=`<!-- Full-page HTML — you design EVERYTHING at 1280x720.
     The app adds no background, no styling. Deck tokens: --acc --acc2 --fd --fb --fm --mut --ink -->
<style>
  body{background:radial-gradient(110% 110% at 80% -10%,#0d1830 0%,#04070f 60%)}

/* starter code for the per-slide BACKGROUND layer (1280x720 sandbox behind the content) */
const BG_TPL=`<!-- Background layer — a 1280x720 sandbox BEHIND the content layer.
     Anything works: gradients, grids, particles, animated scenes. -->
<style>

</style>
<span class="orb" style="width:420px;height:420px;left:8%;top:12%"></span>

  background:radial-gradient(circle,rgba(155,140,255,.4),transparent 70%)"></span>
<div class="grid"></div>`;

/* starter code for the per-slide transparent OVERLAY layer (above the content) */
const SOV_TPL=`<!-- Transparent overlay — floats ABOVE this slide only.
     The background is forced transparent; the slide must stay visible underneath. -->
<style>
  .layer{position:absolute;inset:0;pointer-events:none}
  .frame{position:absolute;inset:26px;border:1px solid rgba(150,180,255,.22);border-radius:20px;

    color:rgba(200,215,255,.65);padding:7px 13px;border:1px solid rgba(150,180,255,.2);border-radius:99px;
    background:rgba(8,14,28,.3);backdrop-filter:blur(4px)}
  .scan{position:absolute;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(77,168,255,.55),transparent);animation:scan 7s linear infinite}
  @keyframes breathe{50%{opacity:.35}}

</style>
<div class="layer">

/* starter code for the fullscreen HTML overlay — subtle animated layer above every slide */
const OV_TPL=`<!-- Fullscreen HTML overlay — a transparent 1280x720 layer ABOVE every slide.

<style>
  .layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}

/* ================= toasts & modal ================= */
function toast(msg,ico='check'){
  const box=$('#toasts');
  while(box.children.length>2)box.firstChild.remove();
  const t=document.createElement('div');t.className='toast';t.innerHTML=ic(ico,16)+`<span>${msg}</span>`;
  box.append(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},3200);
}
function confirmBox({title,body,ok='OK',cancel='Cancel'}){
  return new Promise(res=>{
    const root=$('#modalRoot');
    root.innerHTML=`<div class="mo-back"><div class="mo" role="dialog" aria-modal="true">
      <h3>${esc(title)}</h3><p>${esc(body)}</p>
      <div class="mo-acts"><button class="btn" data-a="no">${esc(cancel)}</button><button class="btn pri" data-a="yes">${esc(ok)}</button></div>
    </div></div>`;
    root.onclick=e=>{
      if(e.target.classList.contains('mo-back')){root.innerHTML='';root.onclick=null;return res(false)}
      const b=e.target.closest('[data-a]');if(!b)return;
      root.innerHTML='';root.onclick=null;res(b.dataset.a==='yes');
    };
  });
}

/* ================= popover ================= */
const pop=$('#pop');let popAnchor=null;
function openPop(anchor,html){
  closePop();pop.hidden=false;pop.innerHTML=html;popAnchor=anchor;
  const r=anchor.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  let x=Math.max(10,Math.min(r.right-pw,innerWidth-pw-10));
  let y=r.bottom+8;if(y+ph>innerHeight-10)y=Math.max(10,r.top-8-ph);
  pop.style.left=x+'px';pop.style.top=y+'px';
}
function closePop(){if(pop.hidden)return;pop.hidden=true;pop.innerHTML='';popAnchor=null;}
document.addEventListener('pointerdown',e=>{
  if(pop.hidden)return;
  if(!pop.contains(e.target)&&!(popAnchor&&popAnchor.contains(e.target)))closePop();
},true);
addEventListener('resize',closePop);

/* ================= model & history (undo/redo) ================= */
let deck=null,cur=0,hist=[],hi=-1,pendingT=null,presenting=false,presRt=null,stageScale=1;
const thumbTimers=new Map();

function normOverlay(o){
  o=(o&&typeof o==='object')?o:{};
  const num=(v,d)=>{v=Number(v);return isFinite(v)?v:d};
  return{
    on:!!o.on,
    text:stripS(String(o.text==null?'':o.text)),
    style:OV_STYLES.includes(o.style)?o.style:'corner',
    pos:OV_POS.includes(o.pos)?o.pos:'br',
    img:(typeof o.img==='string'&&/^(data:image|https?:)/i.test(o.img))?o.img:'',
    imgOp:Math.min(1,Math.max(.05,num(o.imgOp,1))),
    imgScale:Math.min(8,Math.max(.05,num(o.imgScale,1))),
    imgX:num(o.imgX,0),imgY:num(o.imgY,0),
    html:String(o.html==null?'':o.html)
  };
}
function normBg(b){
  b=(b&&typeof b==='object')?b:{};
  return{
    mode:['none','image','html'].includes(b.mode)?b.mode:'none',
    img:(typeof b.img==='string'&&/^(data:image|https?:)/i.test(b.img))?b.img:'',
    fit:b.fit==='contain'?'contain':'cover',
    op:Math.min(1,Math.max(.05,Number.isFinite(+b.op)?+b.op:1)),
    html:String(b.html==null?'':b.html)
  };
}
function normSov(o){
  o=(o&&typeof o==='object')?o:{};
  return{mode:o.mode==='html'?'html':'none',html:String(o.html==null?'':o.html)};
}
function normSlide(s){
  s=s||{};const so=(s.slots&&typeof s.slots==='object')?s.slots:{};
  const str=x=>typeof x==='string'?x:'';
  const bl=Array.isArray(so.bullets)?so.bullets.map(x=>str(x)):[];
  while(bl.length<1)bl.push('');
  let cd=Array.isArray(so.cards)?so.cards.map(c=>(c&&typeof c==='object')?{head:str(c.head),text:str(c.text)}:{head:'',text:''}):[];
  while(cd.length<3)cd.push({head:'',text:''});
  const out={
    id:(typeof s.id==='string'&&s.id)?s.id:uid(),

/* ================= sandboxed iframe plumbing (custom slides + HTML overlay) ================= */
/* Builds the full document for a sandboxed iframe. Bare fragments get wrapped
   with a base (1280x720, fonts, deck tokens); full documents pass through untouched.
   `extra` = raw CSS appended to the base; `guard` = inject the transparency guard
   (overlay layers only: forces html/body transparent AND strips opaque backgrounds
   from large elements, so pasted AI pages can never hide the slide underneath). */
const SOV_FORCE='html,body{background:transparent!important;background-color:transparent!important;background-image:none!important}'
  +'html body,:root body{background:transparent!important;background-color:transparent!important;background-image:none!important}';
/* Runs INSIDE overlay iframes: any element that covers a large part of the layer and paints a
   FULLY opaque flat background (or an all-opaque gradient) is neutralized. Semi-transparent
   glass/veils, bars, badges and small cards are left exactly as authored. */
const SOV_GUARD=`<script>(function(){
function al(c){var m=/rgba?\\(([^)]*)\\)/.exec(c);if(!m)return 1;var p=m[1].split(',');if(p.length<4)return 1;var a=parseFloat(p[3]);return isNaN(a)?1:a}
function go(){
  if(!document.body)return;
  var W=innerWidth,H=innerHeight;if(!W||!H)return;
  var els=[document.body].concat([].slice.call(document.body.querySelectorAll('*')));
  for(var i=0;i<els.length;i++){
    var el=els[i],r;
    try{r=el.getBoundingClientRect()}catch(e){continue}
    if(r.width<W*.5||r.height<H*.5)continue;               /* only large, slide-hiding regions */
    var cs;try{cs=getComputedStyle(el)}catch(e){continue}
    if(cs.backgroundColor&&al(cs.backgroundColor)>=0.85)el.style.backgroundColor='transparent';
    var bi=cs.backgroundImage;
    if(bi&&bi!=='none'&&bi.indexOf('gradient')>-1){        /* all-opaque gradient = opaque paint */
      var cols=(bi.match(/rgba?\\([^)]*\\)/g)||[]);
      if(cols.length&&cols.every(function(c){return al(c)>=0.85}))el.style.backgroundImage='none';
    }
  }
}
if(document.readyState==='complete')setTimeout(go,0);else addEventListener('load',function(){setTimeout(go,0)});
setTimeout(go,650);
})()</scr`+`ipt>`;

  if(/<!doctype\s+html|<html[\s>]/i.test(code)){

/* Generic template → iframe mount (idempotent). */
function mountTpl(holder,cls,frameCls,after){
  if(!holder)return;

  f.setAttribute('allowtransparency','true');
  f.setAttribute('aria-hidden','true');f.tabIndex=-1;f.draggable=false;
  f.srcdoc=t.content.textContent||'';
  holder.appendChild(f);after&&after(holder);

/* ---- image import: data URL, auto-downscaled to the 1280×720 stage (GIF/SVG kept intact) ---- */
function importImageFile(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{
    const url=String(rd.result);
    if(file.type==='image/gif'||file.type==='image/svg+xml')return cb(url);
    const im=new Image();
    im.onload=()=>{
      const w=im.naturalWidth,h=im.naturalHeight;
      if(!w||!h||(w<=1280&&h<=720))return cb(url);
      const s=Math.min(1280/w,720/h),cw=Math.round(w*s),ch=Math.round(h*s);
      try{
        const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
        cv.getContext('2d').drawImage(im,0,0,cw,ch);
        cb(cv.toDataURL('image/png'));
      }catch(err){cb(url)}
    };
    im.onerror=()=>cb(url);
    im.src=url;
  };
  rd.onerror=()=>toast('Could not read that file','x');
  rd.readAsDataURL(file);
}

/* ================= 3-SCREEN LAYER VIEW (bg · content · overlay · combined) ================= */
const layerViewEl=$('#layerView');let lvRt=null;
function layerViewOpen(){return layerViewEl.classList.contains('on')}
function closeLayerView(){
  if(!layerViewOpen())return;
  if(lvRt){lvRt.disconnect();lvRt=null}
  layerViewEl.classList.remove('on');layerViewEl.innerHTML='';
}
/* stage containing exactly ONE layer of the current slide */
function lvStage(which){
  const sl=deck.slides[cur],light=deck.theme==='light';
  const st=document.createElement('div');
  st.className='stage'+(light?' light':'');
  st.style.setProperty('--acc',sl.accent);
  st.style.setProperty('--acc2',accent2(sl.accent));
  if(which==='bg'){
    const h=bgHTML(sl,true);
    if(h)st.innerHTML=h;
    return{st,empty:!h};
  }
  if(which==='main'){
    if(sl.layout==='custom'){
      st.classList.add('lay-html');
      st.innerHTML='<div class="cust-hold" aria-hidden="true"></div>';
      const t=document.createElement('template');t.className='cust-src';
      t.content.textContent=buildSrcdoc(sl.slots.html,sl.accent,true);
      st.appendChild(t);
      return{st,empty:!txt(sl.slots.html)};
    }
    st.classList.add('lay-'+sl.layout);
    st.innerHTML='<div class="sc">'+slideInner(sl,false)+'</div>';
    return{st,empty:false};
  }
  if(which==='ov'){
    /* ONE overlay layer = slide-scope overlay + deck-scope overlay composited together */
    const h=sovHTML(sl,true);
    const d=deck.overlay&&deck.overlay.on?overlayHTML(false,sl,true):'';
    if(h||d){st.innerHTML=(h||'')+(d||'');return{st,empty:false}}
    return{st,empty:true};
  }
  return{st:renderSlideNode(sl,'view'),empty:false};   /* combined — the full stack */
}
function lvChip(which){
  const sl=deck.slides[cur];
  if(which==='bg'){
    if(sl.bg.mode==='image')return sl.bg.img?'image · '+sl.bg.fit:'image · empty';
    if(sl.bg.mode==='html')return txt(sl.bg.html)?'html · '+kbLen(sl.bg.html):'html · empty';
    return 'none · app default';
  }
  if(which==='main')return sl.layout==='custom'?'full-page html':'auto · '+LAYOUTS[sl.layout].name.toLowerCase();
  if(which==='ov'){
    const a=sl.sov.mode==='html'&&txt(sl.sov.html);
    const ov=deck.overlay||{};
    const dB=!!(ov.on&&((ov.style==='html'&&txt(ov.html))||(ov.style==='image'&&ov.img)
      ||(ov.style!=='html'&&ov.style!=='image'&&txt(ov.text))));
    const dName=ov.style==='html'?'html':'© '+ov.style;
    if(a&&dB)return 'slide html + deck '+dName;
    if(a)return 'html · transparent';
    if(dB)return 'deck '+dName;
    return 'none';
  }
  return 'what the audience sees';
}
function openLayerView(){
  if(presenting)return;
  closePop();
  const sl=deck.slides[cur];
  const defs=[
    {w:'bg',n:'1',t:'Background',note:'checkerboard = transparency'},
    {w:'main',n:'2',t:'Content',note:'the page itself'},
    {w:'ov',n:'3',t:'Overlay',note:'transparent layer · checkerboard shows through'},
    {w:'all',n:'+',t:'Combined',note:'background + content + overlay'}
  ];
  layerViewEl.innerHTML=`
    <div class="lv-top">
      <div><b>Layer view</b><small>Slide ${cur+1} of ${deck.slides.length} · ${esc(sl.layout==='custom'?'HTML page':LAYOUTS[sl.layout].name)}</small></div>
      <button class="ib" id="lvX" type="button" title="Close (Esc)"></button>
    </div>
    <div class="lv-grid" id="lvGrid"></div>`;
  const grid=layerViewEl.querySelector('#lvGrid');
  defs.forEach(d=>{
    const r=lvStage(d.w);
    const tile=document.createElement('div');
    tile.className='lv-tile';
    if(d.w!=='all')tile.dataset.check='1';
    else tile.dataset.final='1';
    const chip=lvChip(d.w);
    tile.innerHTML=`<div class="lv-head"><span class="lv-idx">${d.n}</span><b>${d.t}</b>
        <span class="lv-chip${/empty|none/.test(chip)?'':' on'}">${chip}</span></div>
      <div class="lv-body"></div>
      <div class="lv-note">${d.note}</div>`;
    const body=tile.querySelector('.lv-body');
    if(r.empty){
      body.innerHTML='<div class="lv-empty">'+(d.w==='bg'
        ?'no background on this slide —<br>the app default backdrop shows'
        :'no overlay — this slide or deck scope<br>add one in the Overlay tab')+'</div>';
    }else{
      const fr=document.createElement('div');fr.className='lv-frame';
      fr.append(r.st);body.append(fr);
      mountCust(r.st);mountBg(r.st);mountSov(r.st);mountOv(r.st);
    }
    grid.append(tile);
  });
  layerViewEl.classList.add('on');
  const x=layerViewEl.querySelector('#lvX');
  x.innerHTML=ic('x');
  x.addEventListener('click',closeLayerView);
  fitLayerView();
  lvRt=new ResizeObserver(fitLayerView);
  lvRt.observe(grid);
}
function fitLayerView(){
  $$('#layerView .lv-tile').forEach(tile=>{
    const fr=tile.querySelector('.lv-frame');if(!fr)return;
    const body=tile.querySelector('.lv-body');if(!body)return;
    const r=body.getBoundingClientRect();
    if(!r.width||!r.height)return;
    const s=Math.max(.05,Math.min((r.width-14)/1280,(r.height-14)/720));
    fr.style.width=1280*s+'px';fr.style.height=720*s+'px';
    fr.style.left=(r.width-1280*s)/2+'px';fr.style.top=(r.height-720*s)/2+'px';
    const st=fr.querySelector('.stage');if(st)st.style.transform='scale('+s+')';
  });
}

/* ================= slide renderer (shared by canvas / thumbs / present / export) =================
   Every slide is a 3-layer stack: BACKGROUND (image/html) → CONTENT (auto layout or full-page
   pure HTML — the app adds nothing) → per-slide TRANSPARENT OVERLAY (html) → deck © overlay. */
const PH={kick:'Kicker',title:'Click to add title',body:'Click to add text',quote:'Add the statement',bullet:'Bullet text',cardh:'Card title',cardtxt:'Card text'};
const ED=(cls,k,html,ph,i)=>`<div class="ed ${cls}" contenteditable="true" spellcheck="false" data-k="${k}"${i!==undefined?` data-i="${i}"`:''} data-ph="${ph}">${html||''}</div>`;

function bulletsHTML(sl,edit){
  const rows=sl.slots.bullets;
  const shown=edit?rows:rows.filter(b=>txt(b));
  const list=shown.map((b,i)=>`<div class="b-row" data-i="${i}">
    <span class="b-num">${pad(i+1)}</span>
    ${ED('b-txt','bullet',b,PH.bullet,i)}
    <button class="row-x" type="button" aria-label="Remove bullet">${ic('x',13)}</button>
  </div>`).join('');
  return `<div class="b-list">${list}</div>`+
    (edit?`<button class="b-add" type="button">${ic('plus',15)}<span>Add bullet</span></button>`:'');
}
function cardsHTML(sl,edit){
  const cd=sl.slots.cards;
  const shown=edit?cd:cd.filter(c=>txt(c.head)||txt(c.text));
  if(!edit&&!shown.length)return'';
  const n=edit?cd.length:shown.length;
  const cols=n<=1?1:n===2?2:n===3?3:n===4?4:3;
  const cells=shown.map((c,i)=>`<div class="c-card" data-i="${i}">
    <button class="card-x" type="button" aria-label="Remove card">${ic('x',13)}</button>
    ${ED('c-head','cardh',c.head,PH.cardh,i)}
    ${ED('c-txt','cardt',c.text,PH.cardtxt,i)}
  </div>`).join('');
  const add=edit&&cd.length<6?`<button class="c-add" type="button">${ic('plus',18)}<span>Add card</span></button>`:'';
  return `<div class="c-grid" style="grid-template-columns:repeat(${cols},1fr)">${cells}${add}</div>`;
}
function slideInner(sl,edit){
  const S=sl.slots,L=sl.layout;
  const has=h=>edit||txt(h)!=='';
  const kick=has(S.kicker)?ED('s-kick','kick',S.kicker,PH.kick):'';
  const body=has(S.body)?ED('s-body','body',S.body,PH.body):'';
  const tit=()=>ED('s-title','title',S.title,PH.title);
  if(L==='title'||L==='section')return kick+tit()+body;
  if(L==='content')return kick+tit()+body;
  if(L==='quote')return kick+(has(S.quote)?'<span class="qmark" aria-hidden="true">“</span>':'')+ED('s-quote','quote',S.quote,PH.quote)+body;
  if(L==='bullets')return kick+tit()+bulletsHTML(sl,edit)+body;
  if(L==='cards')return kick+tit()+cardsHTML(sl,edit)+body;
  return'';
}
function renderSlideNode(sl,mode){
  const light=deck.theme==='light';
  const isHtml=sl.layout==='custom';
  const hasBg=sl.bg&&sl.bg.mode!=='none'&&((sl.bg.mode==='image'&&sl.bg.img)||(sl.bg.mode==='html'&&txt(sl.bg.html)));
  const st=document.createElement('div');
  const bg=bgHTML(sl,mode==='view');
  const sov=sovHTML(sl,mode==='view');
  const ovHTML=overlayHTML(mode==='edit',sl,mode==='view');
  if(isHtml){
    /* full-page pure HTML — no ambient FX, no app background, nothing */
    st.className='stage lay-html'+(light?' light':'')+(hasBg?' has-bg':'')+(mode==='edit'?' editing':'');
    st.style.setProperty('--acc',sl.accent);
    st.style.setProperty('--acc2',accent2(sl.accent));
    st.innerHTML='<div class="cust-hold" aria-hidden="true"></div>'
      +(mode==='edit'?'<div class="cust-flag">HTML page — edit the code below · nothing added by the app</div>':'');
    const t=document.createElement('template');t.className='cust-src';
    t.content.textContent=buildSrcdoc(sl.slots.html,sl.accent,mode==='view'); /* thumbs get paused animations */
    st.appendChild(t);
    if(bg)st.insertAdjacentHTML('afterbegin',bg);
    if(sov)st.insertAdjacentHTML('beforeend',sov);
    if(ovHTML)st.insertAdjacentHTML('beforeend',ovHTML);
    return st;
  }
  st.className='stage lay-'+sl.layout+(light?' light':'')+(hasBg?' has-bg':'')+(mode==='edit'?' editing':'');
  st.style.setProperty('--acc',sl.accent);
  st.style.setProperty('--acc2',accent2(sl.accent));
  st.innerHTML=`<div class="sc">${slideInner(sl,mode==='edit')}</div>`;
  if(mode==='present'){let k=0;st.querySelectorAll('.sc > *').forEach(n=>{n.classList.add('a');n.style.setProperty('--d',k++)})}
  if(bg)st.insertAdjacentHTML('afterbegin',bg);
  if(sov)st.insertAdjacentHTML('beforeend',sov);
  if(ovHTML)st.insertAdjacentHTML('beforeend',ovHTML);
  return st;
}
function slideLabel(sl){
  if(sl.layout==='custom'){
    const t=txt(String(sl.slots.html||'')
      .replace(/<style[\s\S]*?<\/style>/gi,' ')
      .replace(/<script[\s\S]*?<\/script>/gi,' '));
    return t.slice(0,60)||'Custom HTML';
  }
  return txt(sl.slots.kicker)||txt(sl.slots.title)||'';
}

/* ================= canvas (edit surface) ================= */
const stageHost=$('#stageHost');
function renderCanvas(){
  const sl=deck.slides[cur];
  const node=renderSlideNode(sl,'edit');
  stageHost.replaceChildren(node);
  if(sl.layout==='custom')mountCust(node);
  else wireStage(sl);
  mountBg(node);mountSov(node);mountOv(node);
  wireOvText(node);
  wireOvDrag(node);
}
function applyEdit(sl,ed){
  const k=ed.dataset.k,i=+(ed.dataset.i||0),v=ed.innerHTML;
  if(k==='kick')sl.slots.kicker=v;
  else if(k==='title')sl.slots.title=v;
  else if(k==='body')sl.slots.body=v;
  else if(k==='quote')sl.slots.quote=v;
  else if(k==='bullet')sl.slots.bullets[i]=v;
  else if(k==='cardh')sl.slots.cards[i].head=v;
  else if(k==='cardt')sl.slots.cards[i].text=v;
}
function normEd(ed){if(!txt(ed.innerHTML))ed.innerHTML=''}
function placeCaretEnd(el){
  el.focus();
  const r=document.createRange();r.selectNodeContents(el);r.collapse(false);
  const s=getSelection();s.removeAllRanges();s.addRange(r);
}
function plainPaste(e){
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
}
function rerenderFocus(sl,sel){
  renderCanvas();
  const f=stageHost.querySelector(sel);
  if(f)placeCaretEnd(f);
}
function wireStage(sl){
  $$('#stageHost .ed').forEach(ed=>{
    if(ed.dataset.k==='ovtext')return;                    /* overlay text wired separately (works on custom slides too) */
    ed.addEventListener('input',()=>{applyEdit(sl,ed);queueCommit();thumbSoon()});
    ed.addEventListener('blur',()=>{normEd(ed);applyEdit(sl,ed);flushCommit();thumbSoon()});
    ed.addEventListener('paste',plainPaste);
    ed.addEventListener('keydown',e=>{
      const k=ed.dataset.k,i=+(ed.dataset.i||0);
      if(e.key==='Enter'&&k==='bullet'){e.preventDefault();
        sl.slots.bullets.splice(i+1,0,'');flushCommit();rerenderFocus(sl,`[data-k="bullet"][data-i="${i+1}"]`);commit();return}
      if(e.key==='Enter'&&(k==='kick'||k==='cardh')){e.preventDefault();ed.blur();return}
      if(e.key==='Backspace'&&k==='bullet'&&!txt(ed.innerHTML)&&sl.slots.bullets.length>1){
        e.preventDefault();sl.slots.bullets.splice(i,1);flushCommit();
        rerenderFocus(sl,`[data-k="bullet"][data-i="${Math.max(0,i-1)}"]`);commit();return}
    });
  });
  $$('#stageHost .row-x').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.closest('.b-row').dataset.i;
    if(sl.slots.bullets.length>1)sl.slots.bullets.splice(i,1);else sl.slots.bullets=[''];
    flushCommit();rerenderFocus(sl,`[data-k="bullet"][data-i="${Math.min(i,sl.slots.bullets.length-1)}"]`);commit();
  }));
  $$('#stageHost .card-x').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.closest('.c-card').dataset.i;
    if(sl.slots.cards.length>1)sl.slots.cards.splice(i,1);else sl.slots.cards=[{head:'',text:''}];
    flushCommit();rerenderFocus(sl,`[data-k="cardh"][data-i="${Math.min(i,sl.slots.cards.length-1)}"]`);commit();
  }));
  const ba=$('#stageHost .b-add');
  if(ba)ba.addEventListener('click',()=>{sl.slots.bullets.push('');flushCommit();rerenderFocus(sl,`[data-k="bullet"][data-i="${sl.slots.bullets.length-1}"]`);commit()});
  const ca=$('#stageHost .c-add');
  if(ca)ca.addEventListener('click',()=>{sl.slots.cards.push({head:'',text:''});flushCommit();rerenderFocus(sl,`[data-k="cardh"][data-i="${sl.slots.cards.length-1}"]`);commit()});
}
/* inline editing of the corner/bar overlay text — on any layout */
function wireOvText(st){
  const ed=st.querySelector(':scope > .ov .ed');
  if(!ed)return;
  ed.addEventListener('input',()=>{deck.overlay.text=ed.innerHTML;queueCommit();overlayThumbsSoon()});
  ed.addEventListener('blur',()=>{
    if(!txt(ed.innerHTML))ed.innerHTML='';
    deck.overlay.text=ed.innerHTML;flushCommit();overlayThumbsSoon();
  });
  ed.addEventListener('paste',plainPaste);
  ed.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ed.blur()}});
}
/* drag the fullscreen image overlay directly on the canvas */
function wireOvDrag(st){
  const im=st.querySelector(':scope > .ov-img > img');
  if(!im)return;
  im.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    e.preventDefault();
    const sx=e.clientX,sy=e.clientY,ox=deck.overlay.imgX||0,oy=deck.overlay.imgY||0;
    try{im.setPointerCapture(e.pointerId)}catch(err){}
    const mv=ev=>{
      deck.overlay.imgX=Math.round(ox+(ev.clientX-sx)/stageScale);
      deck.overlay.imgY=Math.round(oy+(ev.clientY-sy)/stageScale);
      im.style.transform=imgTransform();
    };
    const up=()=>{
      im.removeEventListener('pointermove',mv);
      im.removeEventListener('pointerup',up);
      im.removeEventListener('pointercancel',up);
      flushCommit();commit();overlayThumbsSoon();
    };
    im.addEventListener('pointermove',mv);
    im.addEventListener('pointerup',up);
    im.addEventListener('pointercancel',up);
  });
}
function fitStage(){
  const c=$('#canvas'),f=$('#eFrame');
  const r=c.getBoundingClientRect(),pad=30;
  const s=Math.max(.18,Math.min(Math.min((r.width-pad*2)/1280,(r.height-pad*2)/720),1.15));
  f.style.width=1280*s+'px';f.style.height=720*s+'px';f.style.left=(r.width-1280*s)/2+'px';f.style.top=(r.height-720*s)/2+'px';
  stageHost.style.transform=`scale(${s})`;
  stageScale=s;
  $('#zoomChip').textContent=Math.round(s*100)+'%';
}

/* ================= filmstrip ================= */
const stripList=$('#stripList');
let thumbIO=null;
function ensureThumbIO(){
  if(thumbIO)return thumbIO;
  thumbIO=new IntersectionObserver(es=>{
    es.forEach(en=>{
      if(!en.isIntersecting)return;
      const st=en.target.querySelector('.stage');
      if(st)mountAll(st);            /* mounts custom-slide + HTML-overlay iframes as thumbs scroll near */
    });
  },{root:stripList,rootMargin:'200px'});
  return thumbIO;
}
function buildStrip(){
  stripList.innerHTML='';
  const io=ensureThumbIO();
  deck.slides.forEach((sl,i)=>{
    const it=document.createElement('div');
    it.className='t-item'+(i===cur?' sel':'');it.dataset.id=sl.id;it.dataset.i=i;
    it.innerHTML=`<div class="t-thumb" role="button" aria-label="Slide ${i+1}">
      <div class="mini"></div>
      <span class="t-num">${i+1}</span>
      <span class="t-acts">
        <button class="ta" data-a="dup" type="button" title="Duplicate">${ic('copy',13)}</button>
        <button class="ta del" data-a="del" type="button" title="Delete">${ic('trash',13)}</button>
      </span>
    </div>`;
    it.querySelector('.mini').append(renderSlideNode(sl,'view'));
    io.observe(it.querySelector('.t-thumb'));
    stripList.append(it);
  });
  $('#stripCount').textContent=deck.slides.length+'';
}
function refreshThumb(){
  const it=stripList.children[cur];
  if(!it||it.dataset.id!==deck.slides[cur].id)return;
  const sl=deck.slides[cur];
  const hadOv=!!it.querySelector('.ov-html iframe');
  it.querySelector('.mini').replaceChildren(renderSlideNode(sl,'view'));
  const st=it.querySelector('.stage');
  if(!st)return;
  if(sl.layout==='custom')mountCust(st);
  if(sl.bg.mode==='html'&&txt(sl.bg.html))mountBg(st);
  if(sl.sov.mode==='html'&&txt(sl.sov.html))mountSov(st);
  if(hadOv)mountOv(st);
}
function thumbSoon(){
  clearTimeout(thumbTimers.get('t'));
  thumbTimers.set('t',setTimeout(refreshThumb,300));
}
function select(i){
  cur=Math.max(0,Math.min(deck.slides.length-1,i));
  $$('#stripList .t-item').forEach((it,k)=>{
    it.classList.toggle('sel',k===cur);
    it.querySelector('.t-num').textContent=k+1;
  });
  const it=stripList.children[cur];if(it)it.scrollIntoView({block:'nearest'});
  renderCanvas();updateCtx();updatePane();
}
function updateCtx(){
  const sl=deck.slides[cur];
  $('#cNum').innerHTML=`Slide <b>${cur+1}</b> / ${deck.slides.length}`;
  $('#cLayoutName').textContent=LAYOUTS[sl.layout].name;
  $$('#cAccents .sw').forEach(b=>b.classList.toggle('on',b.dataset.a===sl.accent));
  $$('#cTheme button').forEach(b=>b.classList.toggle('on',b.dataset.th===deck.theme));
  $('#cDel').disabled=deck.slides.length<=1;
}

/* ---- drag reorder ---- */
stripList.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('.ta'))return;
  const item=e.target.closest('.t-item');if(!item)return;
  const from=+item.dataset.i;
  const sx=e.clientX,sy=e.clientY;
  let started=false,ghost=null,line=null;
  const listRect=()=>stripList.getBoundingClientRect();
  const begin=()=>{
    started=true;item.classList.add('lift');
    line=document.createElement('div');line.className='dropline';stripList.append(line);
    ghost=document.createElement('div');ghost.className='drag-ghost';
    const g=item.querySelector('.mini').cloneNode(true);
    g.querySelectorAll('iframe').forEach(f=>f.remove());                       /* don't clone live iframes */
    g.querySelectorAll('.cust-on').forEach(el=>el.classList.remove('cust-on'));
    ghost.append(g);
    document.body.append(ghost);document.body.classList.add('noselect');
  };
  const move=ev=>{
    if(!started){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;begin()}
    ghost.style.left=ev.clientX-30+'px';ghost.style.top=ev.clientY-14+'px';
    const lr=listRect();
    if(ev.clientY<lr.top+34)stripList.scrollTop-=9;
    if(ev.clientY>lr.bottom-34)stripList.scrollTop+=9;
    const items=[...stripList.querySelectorAll('.t-item:not(.lift)')];
    let idx=0;
    for(const it of items){const r=it.getBoundingClientRect();if(ev.clientY<r.top+r.height/2)break;idx++}
    let y;
    if(idx===0&&items[0])y=items[0].getBoundingClientRect().top-7;
    else if(items[idx-1])y=items[idx-1].getBoundingClientRect().bottom+7;
    else y=12;
    line.style.top=(y-lr.top+stripList.scrollTop)+'px';
    line.dataset.idx=idx;
  };
  const finish=()=>{
    removeEventListener('pointermove',move);
    if(started){
      const to=+(line.dataset.idx||from);
      ghost.remove();line.remove();document.body.classList.remove('noselect');
      item.classList.remove('lift');
      if(to!==from)moveSlide(from,to);
    }else select(from);
  };
  addEventListener('pointermove',move);
  addEventListener('pointerup',finish,{once:true});
  addEventListener('pointercancel',()=>{
    removeEventListener('pointermove',move);
    if(started){ghost&&ghost.remove();line&&line.remove();item.classList.remove('lift');document.body.classList.remove('noselect')}
  },{once:true});
});
stripList.addEventListener('click',e=>{
  const b=e.target.closest('.ta');if(!b)return;
  const item=e.target.closest('.t-item');const i=+item.dataset.i;
  if(b.dataset.a==='dup')dupSlide(i);else delSlide(i);
});
stripList.addEventListener('dblclick',e=>{
  if(e.target.closest('.ta'))return;
  openPresent(+e.target.closest('.t-item').dataset.i);
});

/* ================= slide operations ================= */
function addAfter(i,sl){
  flushCommit();
  deck.slides.splice(i+1,0,sl);
  buildStrip();select(i+1);commit();
}
function dupSlide(i){
  const c=normSlide(JSON.parse(JSON.stringify(deck.slides[i])));c.id=uid();
  addAfter(i,c);toast('Slide duplicated','copy');
}
function delSlide(i){
  if(deck.slides.length<=1)return toast('A presentation needs at least one slide','x');
  flushCommit();
  deck.slides.splice(i,1);
  cur=Math.min(i,deck.slides.length-1);
  buildStrip();select(cur);commit();
  toast('Slide deleted — Ctrl+Z to undo','trash');
}
function moveSlide(from,to){
  if(to<0||to>=deck.slides.length||to===from)return;
  flushCommit();
  const sl=deck.slides.splice(from,1)[0];
  deck.slides.splice(to,0,sl);
  buildStrip();select(to);commit();
}
function addQuick(){addAfter(cur,mkBlank('content'))}

/* ================= present runtime (serialized verbatim into exports) ================= */
function presentChromeHTML(){
  return `<nav class="p-dots" id="pDots" aria-label="Slide navigation"></nav>
  <div class="p-hint">← → navigate · F fullscreen · N notes · Esc exit</div>
  <div class="p-bottom">
    <button class="p-nav" id="pPrev" type="button" aria-label="Previous">${ic('left',17)}</button>
    <div class="p-count"><span id="pCur">01</span><i>/</i><span id="pTot"></span></div>
    <div class="p-prog"><i id="pBar"></i></div>
    <button class="p-nav" id="pNext" type="button" aria-label="Next">${ic('right',17)}</button>
  </div>
  <aside class="p-notes" id="pNotes" role="dialog"><div class="p-nh">Speaker notes</div><p id="pNb"></p></aside>`;
}
function initRuntime(onExit,notesFor,at){
  var deckEl=document.querySelector('.deck');
  var S=[].slice.call(deckEl.children);
  var i=at||0;
  var notes=document.getElementById('pNotes'),curEl=document.getElementById('pCur'),
      tot=document.getElementById('pTot'),bar=document.getElementById('pBar'),
      dotsW=document.getElementById('pDots'),nb=document.getElementById('pNb'),
      prev=document.getElementById('pPrev'),next=document.getElementById('pNext');
  function pad2(n){return (n<10?'0':'')+n}
  tot.textContent=pad2(S.length);
  /* mounts a <template> holder into a sandboxed iframe (custom slides + fullscreen HTML overlay) */
  function mountOne(st,cls,holderSel,frameCls,markCls){
    var t=st.querySelector('template.'+cls);if(!t)return;
    var holder=holderSel?st.querySelector(holderSel):st;
    if(!holder||holder.querySelector('iframe.'+frameCls))return;
    var f=document.createElement('iframe');
    f.className=frameCls;f.setAttribute('sandbox','allow-scripts');
    f.setAttribute('aria-hidden','true');f.tabIndex=-1;
    f.srcdoc=t.content.textContent||'';
    holder.appendChild(f);
    if(markCls)st.classList.add(markCls);
  }
  function mountAt(k){
    var sl=S[k];if(!sl)return;
    var st=sl.querySelector('.stage');if(!st)return;
    mountOne(st,'cust-src',null,'cust','cust-on');
    mountOne(st,'bg-src','.bg-lay.bg-html','bg-frame');
    mountOne(st,'sov-src','.sov-lay','sov-frame');
    mountOne(st,'ov-src','.ov-html','ov-frame');
  }
  function warm(k){mountAt(k);mountAt(k+1);mountAt(k-1)}
  var dots=S.map(function(s,k){
    var b=document.createElement('button');
    var lb=s.getAttribute('data-label')||('Slide '+(k+1));
    b.dataset.label=String(lb).slice(0,44);
    b.setAttribute('aria-label','Go to slide '+(k+1));
    b.addEventListener('click',function(e){e.stopPropagation();go(k)});
    dotsW.appendChild(b);return b;
  });
  function syncChrome(){
    curEl.textContent=pad2(i+1);
    bar.style.transform='scaleX('+((i+1)/S.length)+')';
    dots.forEach(function(d,k){d.classList.toggle('on',k===i)});
    nb.textContent=(((notesFor&&notesFor(i))||'').trim())||'No notes for this slide.';
  }
  function go(n){
    n=Math.max(0,Math.min(S.length-1,n));if(n===i)return;
    document.body.classList.remove('fwd','back');
    document.body.classList.add(n>=i?'fwd':'back');
    var o=S[i];
    if(o!==S[n]){o.classList.remove('active');o.classList.add('leaving');
      clearTimeout(o._t);o._t=setTimeout(function(){o.classList.remove('leaving')},700)}
    S[n].classList.add('active');i=n;warm(n);syncChrome();
  }
  function fit(){
    var s=Math.min(innerWidth/1280,innerHeight/720);
    var f=document.getElementById('pFrame');
    f.style.width=1280*s+'px';f.style.height=720*s+'px';
    deckEl.style.transform='scale('+s+')';
  }
  function onKey(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(i+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}
    else if(e.key==='Home')go(0);
    else if(e.key==='End')go(S.length-1);
    else if((e.key||'').toLowerCase()==='f'&&document.documentElement.requestFullscreen){
      e.preventDefault();
      document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    }
    else if((e.key||'').toLowerCase()==='n'){e.preventDefault();notes.classList.toggle('open')}
    else if(e.key==='Escape'){
      if(document.fullscreenElement)document.exitFullscreen();
      else if(onExit)onExit();else notes.classList.remove('open');
    }
  }
  function onClick(e){
    if(e.clientX===0&&e.clientY===0)return;
    if(e.target.closest&&e.target.closest('.p-dots,.p-notes,.p-nav,.p-hint'))return;
    go(e.clientX<innerWidth*.12?i-1:i+1);
  }
  document.addEventListener('keydown',onKey);
  document.addEventListener('click',onClick);
  window.addEventListener('resize',fit);
  prev.addEventListener('click',function(e){e.stopPropagation();go(i-1)});
  next.addEventListener('click',function(e){e.stopPropagation();go(i+1)});
  S[i].classList.add('active');syncChrome();fit();warm(i);
  return{go:go,index:function(){return i},dispose:function(){
    document.removeEventListener('keydown',onKey);
    document.removeEventListener('click',onClick);
    window.removeEventListener('resize',fit);
    dotsW.innerHTML='';
    S.forEach(function(s){s.classList.remove('active','leaving')});
    document.body.classList.remove('fwd','back');
  }};
}
const presentEl=$('#present');
function openPresent(at){
  if(presenting)return;
  closePop();
  flushCommit();
  presenting=true;
  presentEl.classList.toggle('plight',deck.theme==='light');
  if(!presentEl.querySelector('.p-wrap')){
    presentEl.insertAdjacentHTML('afterbegin','<div class="p-wrap"><div class="p-frame" id="pFrame"><div class="deck" id="pDeck"></div></div></div>');
    presentEl.insertAdjacentHTML('beforeend',presentChromeHTML());
  }
  const pDeck=$('#pDeck');pDeck.innerHTML='';
  deck.slides.forEach(sl=>{
    const s=document.createElement('section');s.className='slide';
    s.dataset.label=slideLabel(sl);
    s.append(renderSlideNode(sl,'present'));
    pDeck.append(s);
  });
  presentEl.classList.add('on');
  document.body.classList.add('fwd');
  presRt=initRuntime(closePresent,function(i){return deck.slides[i].notes},Math.max(0,Math.min(at,deck.slides.length-1)));
}
function closePresent(silent){
  if(!presenting)return;
  const end=presRt?presRt.index():cur;
  if(presRt){presRt.dispose();presRt=null}
  presenting=false;
  presentEl.classList.remove('on');
  $('#pDeck').innerHTML='';
  if(!silent)select(Math.min(end,deck.slides.length-1));
}

/* ================= export standalone HTML ================= */
function buildExportHTML(){
  const css=document.getElementById('slide-css').textContent;
  const light=deck.theme==='light';
  const sections=deck.slides.map(sl=>
    '<section class="slide" data-label="'+esc(slideLabel(sl))+'">'+renderSlideNode(sl,'present').outerHTML+'</section>').join('');
  const data=JSON.stringify({title:deck.title,theme:deck.theme,overlay:deck.overlay,slides:deck.slides}).replace(/<\/script/gi,'<\\/script');
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>${esc(deck.title||'Presentation')}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="${FONT_HREF}" rel="stylesheet">
<style>${css}</style>
</head>
<body class="fwd${light?' plight':''}">
 ${BGFX}
<div class="p-wrap"><div class="p-frame" id="pFrame"><div class="deck">${sections}</div></div></div>
 ${presentChromeHTML()}
<script id="deck-data" type="application/json">${data}<\/script>
<script>
var D=JSON.parse(document.getElementById('deck-data').textContent);
(${initRuntime.toString()})(null,function(i){return D.slides[i]&&D.slides[i].notes||''},0);
<\/script>
</body>
</html>`;
}
function doExportHTML(){
  flushCommit();
  download(slug(deck.title)+'.html',new Blob([buildExportHTML()],{type:'text/html'}));
  toast('Presentation exported — open it and use arrow keys','play');
}

/* ================= import ================= */
 $('#fileInput').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let d=null;const t=String(rd.result);
    try{
      if(t.trim().startsWith('{'))d=JSON.parse(t);
      else{const m=t.match(/<script id="deck-data"[^>]*>([\s\S]*?)<\/script>/);if(m)d=JSON.parse(m[1])}
    }catch(err){}
    const dd=d&&d.deck&&d.deck.slides?d.deck:(d&&d.slides?d:null);
    const nd=normDeck(dd);
    if(!nd)return toast('Could not read that file — expected .json or an exported .html','x');
    flushCommit();
    deck=nd;cur=0;
    $('#deckTitle').value=deck.title;setTitle();
    buildStrip();select(0);syncOverlayBtn();commit();
    toast(`Imported “${deck.title}”`,'up');
  };
  rd.readAsText(f);
});

/* ================= new deck ================= */
async function newDeck(){
  const ok=await confirmBox({
    title:'Start a new presentation?',
    body:'Your current deck stays recoverable — press Ctrl+Z right after creating the new one. Nothing leaves this browser.',
    ok:'New presentation'
  });
  if(!ok)return;
  flushCommit();
  deck=normDeck({title:'Untitled presentation',slides:[{layout:'title'}]});
  cur=0;
  $('#deckTitle').value=deck.title;setTitle();
  buildStrip();select(0);syncOverlayBtn();commit();
  toast('New deck — Ctrl+Z restores the previous one','file');
}

/* ================= bottom pane (notes / slide code / bg code / ONE overlay editor) ================= */
/* Overlay tab = the single overlay editor. ovScope picks the target:
   'slide' → this slide's transparent overlay (sl.sov) · 'deck' → the overlay on every slide (deck.overlay). */
let paneMode='notes',ovScope=localStorage.getItem('sm.ovScope')==='deck'?'deck':'slide';
let codeT=null,ovT=null,bgT=null,soT=null;
const codeTa=$('#codeTa'),notesTa=$('#notesTa'),ovTa=$('#ovTa'),bgTa=$('#bgTa'),soTa=$('#soTa');
function applyPane(){
  const p=$('#notesPane');
  p.classList.toggle('mode-code',paneMode==='code');
  p.classList.toggle('mode-bg',paneMode==='bg');
  p.classList.toggle('mode-so',paneMode==='so');
  p.classList.toggle('so-deck',paneMode==='so'&&ovScope==='deck');
  $$('#notesPane .n-tab').forEach(b=>b.classList.toggle('on',b.dataset.p===paneMode));
  $$('#soScope button').forEach(b=>b.classList.toggle('on',b.dataset.s===ovScope));
  $('#paneTip').textContent=
    paneMode==='code'?'· full-page HTML · nothing added by the app · tokens: --acc --acc2 --fd --fb --fm --mut --ink'
    :paneMode==='bg'?'· background layer · 1280×720 sandbox behind the content'
    :paneMode==='so'
    ?(ovScope==='slide'
      ?'· overlay · this slide only · forced transparent · opaque backgrounds stripped'
      :(deck.overlay.on?'· overlay · every slide (deck) · forced transparent · tokens: --acc --acc2 --fd --fb --fm --mut --ink'
                       :'· overlay · every slide (deck) · currently off — typing here turns it on'))
    :'· only you see these when presenting (N)';
}
function updatePane(){
  const sl=deck.slides[cur],isC=sl.layout==='custom',isBg=sl.bg.mode==='html';
  const p=$('#notesPane');
  p.classList.toggle('has-code',isC);
  p.classList.toggle('has-bg',isBg);
  const ok=m=>m==='notes'||m==='so'||(m==='code'&&isC)||(m==='bg'&&isBg);
  if(!ok(paneMode))paneMode=isC?'code':(isBg?'bg':'so');
  codeTa.value=isC?sl.slots.html:'';
  bgTa.value=isBg?sl.bg.html:'';
  soTa.value=sl.sov.mode==='html'?(sl.sov.html||''):'';
  ovTa.value=deck.overlay.style==='html'?(deck.overlay.html||''):'';
  notesTa.value=sl.notes||'';
  applyPane();
}
 $$('#notesPane .n-tab').forEach(b=>b.addEventListener('click',()=>{paneMode=b.dataset.p;applyPane()}));
$$('#soScope button').forEach(b=>b.addEventListener('click',()=>{
  if(ovScope===b.dataset.s)return;
  flushCommit();
  ovScope=b.dataset.s;localStorage.setItem('sm.ovScope',ovScope);
  updatePane();
}));
codeTa.addEventListener('input',()=>{
  const sl=deck.slides[cur];if(sl.layout!=='custom')return;
  sl.slots.html=codeTa.value;
  clearTimeout(codeT);
  codeT=setTimeout(()=>{if(deck.slides[cur]===sl){renderCanvas();refreshThumb()}},450);
  queueCommit();
});
codeTa.addEventListener('blur',flushCommit);
bgTa.addEventListener('input',()=>{
  const sl=deck.slides[cur];if(sl.bg.mode!=='html')return;
  sl.bg.html=bgTa.value;
  clearTimeout(bgT);
  bgT=setTimeout(()=>{if(deck.slides[cur]===sl){renderCanvas();refreshThumb()}},450);
  queueCommit();
});
bgTa.addEventListener('blur',flushCommit);
soTa.addEventListener('input',()=>{
  const sl=deck.slides[cur];
  if(sl.sov.mode!=='html'&&txt(soTa.value))sl.sov.mode='html';   /* typing here enables the layer */
  if(sl.sov.mode!=='html')return;
  sl.sov.html=soTa.value;
  clearTimeout(soT);
  soT=setTimeout(()=>{if(deck.slides[cur]===sl){renderCanvas();refreshThumb()}},450);
  queueCommit();
});
soTa.addEventListener('blur',flushCommit);
ovTa.addEventListener('input',()=>{
  const ov=deck.overlay;
  if(ov.style!=='html'&&txt(ovTa.value)){ov.style='html';ov.on=true;syncOverlayBtn()}   /* typing here turns the deck overlay on */
  if(ov.style!=='html')return;
  ov.html=ovTa.value;
  clearTimeout(ovT);
  ovT=setTimeout(refreshCanvasOverlay,450);
  overlayThumbsSoon();
  queueCommit();
});
ovTa.addEventListener('blur',flushCommit);
[codeTa,ovTa,bgTa,soTa].forEach(ta=>ta.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();
    ta.setRangeText('  ',ta.selectionStart,ta.selectionEnd,'end');
    ta.dispatchEvent(new Event('input'));
  }
}));
 $('#tplBtn').addEventListener('click',()=>{
  if(paneMode==='so'){
    const deckScope=ovScope==='deck';
    const ta=deckScope?ovTa:soTa,tpl=deckScope?OV_TPL:SOV_TPL;
    ta.value=tpl;
    ta.dispatchEvent(new Event('input'));
    toast((deckScope?'Deck':'Slide')+' overlay template inserted — forced transparent','file');
    return;
  }
  if(paneMode==='bg'){
    bgTa.value=BG_TPL;
    bgTa.dispatchEvent(new Event('input'));
    toast('Background template inserted','file');
    return;
  }
  if(deck.slides[cur].layout!=='custom')return;
  codeTa.value=CUSTOM_TPL;
  codeTa.dispatchEvent(new Event('input'));
  toast('Starter template inserted','file');
});

/* ================= wiring ================= */
function setTitle(){document.title=(deck.title||'Untitled')+' — Slidesmith'}
function toggleNotes(){
  $('#center').classList.toggle('no-notes');
  $('#cNotes').classList.toggle('on',!$('#center').classList.contains('no-notes'));
}
function setAppTheme(t){
  document.body.classList.toggle('lite',t==='light');
  localStorage.setItem('sm.appTheme',t);
  const b=$('#btnTheme');
  b.innerHTML=ic(t==='light'?'moon':'sun');
  b.title=t==='light'?'Switch editor to dark':'Switch editor to light';
}
function buildSwatches(){
  const box=$('#cAccents');
  ACCENTS.forEach(([a])=>{
    const b=document.createElement('button');
    b.className='sw';b.type='button';b.dataset.a=a;b.title='Accent '+a;
    b.style.background=`linear-gradient(135deg,${a} 55%,${accent2(a)})`;
    b.addEventListener('click',()=>{
      const sl=deck.slides[cur];if(sl.accent===a)return;
      flushCommit();sl.accent=a;
      buildStrip();select(cur);commit();
    });
    box.append(b);
  });
}
function boot(){
  $('#btnUndo').innerHTML=ic('undo');$('#btnRedo').innerHTML=ic('redo');
  $('#btnImport').innerHTML=ic('up');$('#btnExport').innerHTML=ic('down');
  $('#btnNew').innerHTML=ic('file');
  $('#btnOverlay').innerHTML=ic('copyr');
  $('#btnLayers').innerHTML=ic('layers',15)+'<span>Layers</span>';
  $('#btnPresent').innerHTML=ic('play',15)+'<span>Present</span>';
  $('#cNotes').innerHTML=ic('note');$('#cDup').innerHTML=ic('copy');$('#cDel').innerHTML=ic('trash');
  $('#ehintX').innerHTML=ic('x',12);
  $('#addBtn').innerHTML=ic('plus',16)+'<span>Add slide</span>';
  setAppTheme(localStorage.getItem('sm.appTheme')==='light'?'light':'dark');
  deck=load()||normDeck(SEED);
  $('#deckTitle').value=deck.title;setTitle();
  hist=[snap()];hi=0;updUndo();syncOverlayBtn();
  buildSwatches();buildStrip();select(0);
  $('#btnTheme').addEventListener('click',()=>setAppTheme(document.body.classList.contains('lite')?'dark':'light'));
  $('#btnOverlay').addEventListener('click',e=>openOverlayPanel(e.currentTarget));
  $('#btnLayers').addEventListener('click',e=>openLayersPanel(e.currentTarget));
  $('#btnUndo').addEventListener('click',undo);
  $('#btnRedo').addEventListener('click',redo);
  $('#btnImport').addEventListener('click',()=>$('#fileInput').click());
  $('#btnExport').addEventListener('click',e=>openExportMenu(e.currentTarget));
  $('#btnNew').addEventListener('click',newDeck);
  $('#btnPresent').addEventListener('click',()=>openPresent(cur));
  $('#addBtn').addEventListener('click',e=>openAddPicker(e.currentTarget));
  $('#deckTitle').addEventListener('input',e=>{
    deck.title=e.target.value||'Untitled presentation';setTitle();queueCommit();
  });
  $('#deckTitle').addEventListener('blur',flushCommit);
  $('#cLayout').addEventListener('click',e=>openLayoutMenu(e.currentTarget));
  $$('#cTheme button').forEach(b=>b.addEventListener('click',()=>{
    if(deck.theme===b.dataset.th)return;
    flushCommit();deck.theme=b.dataset.th;
    buildStrip();select(cur);commit();
    toast('Slides switched to '+b.dataset.th+' theme',b.dataset.th==='light'?'sun':'moon');
  }));
  $('#cDup').addEventListener('click',()=>dupSlide(cur));
  $('#cDel').addEventListener('click',()=>delSlide(cur));
  $('#cNotes').classList.add('on');
  $('#cNotes').addEventListener('click',toggleNotes);
  notesTa.addEventListener('input',e=>{deck.slides[cur].notes=e.target.value;queueCommit()});
  notesTa.addEventListener('blur',flushCommit);
  if(localStorage.getItem('sm.hint')==='1')$('#ehint').remove();
  else $('#ehintX').addEventListener('click',()=>{localStorage.setItem('sm.hint','1');$('#ehint').remove()});
  new ResizeObserver(fitStage).observe($('#canvas'));
  addEventListener('beforeunload',persist);
  setInterval(persist,6000);
}

/* ================= global shortcuts ================= */
document.addEventListener('keydown',e=>{
  if(presenting)return;                                  /* present runtime owns keys */
  if(layerViewOpen()){                                   /* 3-screen layer view owns keys */
    if(e.key==='Escape'||e.key.toLowerCase()==='l'){e.preventDefault();closeLayerView()}
    return;
  }
  const mod=e.ctrlKey||e.metaKey;
  const t=e.target;
  const editing=t&&(t.isContentEditable||t.tagName==='INPUT'||t.tagName==='TEXTAREA');
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();flushCommit();persist();toast('All changes saved');return}
  if(e.key==='F5'){e.preventDefault();openPresent(e.shiftKey?cur:0);return}
  if(editing)return;                                     /* native text editing (incl. native Ctrl+Z in fields) */
  if(mod&&e.key.toLowerCase()==='m'){e.preventDefault();addQuick();return}
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();dupSlide(cur);return}
  if(mod&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if((mod&&e.shiftKey&&e.key.toLowerCase()==='z')||(mod&&e.key.toLowerCase()==='y')){e.preventDefault();redo();return}
  if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();moveSlide(cur,e.key==='ArrowUp'?cur-1:cur+1);return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delSlide(cur);return}
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();select(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();select(cur-1)}
  else if(e.key==='Home')select(0);
  else if(e.key==='End')select(deck.slides.length-1);
  else if(e.key.toLowerCase()==='n')toggleNotes();
  else if(e.key.toLowerCase()==='l')openLayerView();
  else if(e.key==='Escape'){
    closePop();
    const a=document.activeElement;a&&a.blur&&a.blur();
  }
});

boot();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stagesmith Stage Runtime</title>
<script type="importmap">
{
  "imports": {
    "react": "/api/vendor/react.js?v=__V__",
    "react/jsx-runtime": "/api/vendor/react-jsx-runtime.js?v=__V__",
    "react-dom/client": "/api/vendor/react-dom.js?v=__V__",
    "stagesmith": "/api/vendor/stagesmith.js?v=__V__",
    "lucide-react": "/api/vendor/lucide-react.js?v=__V__"
  }
}
</script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}
  #root{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0}
  .ss-stage{position:absolute;inset:0;overflow:hidden}
  .ss-layer{position:absolute;inset:0}
  .ss-bg{z-index:0}
  .ss-content{z-index:1}
  .ss-overlay{z-index:2;pointer-events:none}
  .ss-static *{animation:none !important;transition:none !important}
  /* code panels — cap height + themed scrollbars (fix: long code scrolls
     vertically inside the block instead of stretching the slide). Deck
     themes can override; horizontal scroll keeps working. */
  .code pre {
    max-height: 440px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong, rgba(128,128,128,.5)) transparent;
  }
  .code pre::-webkit-scrollbar { width: 10px; height: 10px; }
  .code pre::-webkit-scrollbar-track { background: transparent; }
  .code pre::-webkit-scrollbar-thumb {
    background: var(--border-strong, rgba(128,128,128,.45));
    border-radius: 999px;
    border: 3px solid var(--code-bg, transparent);
    background-clip: content-box;
  }
  .code pre::-webkit-scrollbar-thumb:hover {
    background: var(--muted, rgba(128,128,128,.85));
    border: 2px solid var(--code-bg, transparent);
    background-clip: content-box;
  }
  /* thumbnails: faithful unclipped static render, no scroll chrome */
  .ss-static .code pre { max-height: none; scrollbar-width: none; }
  .ss-static .code pre::-webkit-scrollbar { display: none; }

  /* ---- code panels: fullscreen viewer ---- */
  .code.has-x { position: relative; }
  .code.has-x .code-bar { padding-right: 50px; }
  .ss-code-x {
    position: absolute; top: 7px; right: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    width: 27px; height: 27px; border-radius: 8px; padding: 0;
    border: 1px solid var(--border-strong, rgba(128,128,128,.4));
    background: transparent; color: var(--muted, rgba(128,128,128,.9));
    cursor: pointer; flex: none;
    transition: color .15s, border-color .15s, background .15s;
  }
  .ss-code-x:hover, .ss-code-x.hover {
    color: var(--fg, #fff); border-color: var(--fg, #fff);
    background: rgba(128,128,128,.14);
    background: color-mix(in srgb, var(--fg, #fff) 9%, transparent);
  }
  .ss-code-x svg { width: 13px; height: 13px; display: block; }
  .ss-code-x::after {
    content: attr(data-tip); position: absolute; top: calc(100% + 7px); right: 0;
    white-space: nowrap; pointer-events: none; z-index: 60;
    background: var(--inv-bg, #222); color: var(--inv-fg, #fff);
    font: 500 9px/1 var(--font-mono, ui-monospace); letter-spacing: .14em; text-transform: uppercase;
    padding: 6px 9px; border-radius: 6px;
    opacity: 0; transform: translateY(-2px);
    transition: opacity .15s, transform .15s;
  }
  .ss-code-x:hover::after, .ss-code-x.hover::after { opacity: 1; transform: none; }
  .ss-static .ss-code-x { display: none; }

  /* the viewer — rendered inside the scaled stage so it inherits the deck
     theme tokens and the .tk-* token colors of the code markup */
  .ss-code-modal {
    position: fixed; inset: 0; z-index: 90;
    display: flex; align-items: center; justify-content: center;
    padding: 44px;
    background: rgba(0,0,0,.78);
    background: color-mix(in srgb, var(--bg, #000) 78%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .ss-code-modal-card {
    width: min(1120px, 100%); max-height: 100%;
    display: flex; flex-direction: column;
    border: 1px solid var(--border-strong, #3d3d3d); border-radius: 16px;
    background: var(--code-bg, #0a0a0a);
    box-shadow: 0 30px 90px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .ss-code-modal-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 13px 18px; border-bottom: 1px solid var(--border, #242424);
  }
  .ss-code-modal-title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .ss-code-modal-name {
    font: 500 11px var(--font-mono, ui-monospace); letter-spacing: .16em; text-transform: uppercase;
    color: var(--fg, #fff); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ss-code-modal-tag { font: 400 10px var(--font-mono, ui-monospace); letter-spacing: .14em; text-transform: uppercase; color: var(--faint, #777); }
  .ss-code-modal-close {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer; padding: 0;
    border: 1px solid var(--border-strong, #3d3d3d); background: transparent; color: var(--muted, #aaa);
    transition: color .15s, border-color .15s;
  }
  .ss-code-modal-close:hover { color: var(--fg, #fff); border-color: var(--fg, #fff); }
  .ss-code-modal-close svg { width: 13px; height: 13px; display: block; }
  .ss-code-modal-pre {
    flex: 1; min-height: 0; margin: 0; padding: 26px 30px;
    overflow: auto; overscroll-behavior: contain;
    font: 400 21px/1.75 var(--font-mono, ui-monospace); color: var(--muted, #a5a5a5);
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong, rgba(128,128,128,.5)) transparent;
  }
  .ss-code-modal-pre::-webkit-scrollbar { width: 10px; height: 10px; }
  .ss-code-modal-pre::-webkit-scrollbar-track { background: transparent; }
  .ss-code-modal-pre::-webkit-scrollbar-thumb {
    background: var(--border-strong, rgba(128,128,128,.45));
    border-radius: 999px; border: 3px solid var(--code-bg, transparent); background-clip: content-box;
  }
  #errcard{
    position:absolute;left:40px;top:40px;right:40px;z-index:50;
    background:#14100e;color:#fca5a5;border:1px solid #7f1d1d;border-radius:12px;
    padding:22px 26px;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;
    white-space:pre-wrap;word-break:break-word;pointer-events:none;
  }
  #errcard .err-head{
    color:#f87171;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:11px;margin-bottom:10px;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="errcard" hidden><div class="err-head">Slide error</div><pre id="errmsg" style="margin:0;font:inherit;color:inherit;white-space:inherit"></pre></div>
<script>
/* boot watchdog — reports module load failures back to the parent */
window.__ssErrors = [];
window.addEventListener("error", function (e) {
  window.__ssErrors.push(String(e.message || e.error));
  try { parent.postMessage({ type: "boot-error", frameId: new URLSearchParams(location.search).get("f") || "boot", message: String(e.message || e.error) }, "*"); } catch (err) {}
});
window.addEventListener("unhandledrejection", function (e) {
  var r = e.reason;
  var msg = r && r.message ? r.message : String(r);
  window.__ssErrors.push(msg);
  try { parent.postMessage({ type: "boot-error", frameId: new URLSearchParams(location.search).get("f") || "boot", message: msg }, "*"); } catch (err) {}
});
</script>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import * as stagesmith from "stagesmith";


try { parent.postMessage({ type: "boot-ok", frameId: new URLSearchParams(location.search).get("f") || "boot" }, "*"); } catch (e) { /* ignore */ }

// guard against double module execution in the same document
if (window.__ssInstance) {
  // already booted — re-post ready so the parent can re-send its config
  try { parent.postMessage({ type: "ready", frameId: new URLSearchParams(location.search).get("f") || "boot" }, "*"); } catch (e) {}
} else {
  window.__ssInstance = true;

const rootEl = document.getElementById("root");
const root = createRoot(rootEl);
const errCard = document.getElementById("errcard");
const errMsg = document.getElementById("errmsg");

let cfg = null;                 // last render config
const modules = { slide: null, bg: null, overlay: null, commonOverlay: null };
const moduleUrls = { slide: null, bg: null, overlay: null, commonOverlay: null };
let stepsReported = -1;

/* ---------------- helpers ---------------- */

function post(msg) {
  if (!cfg) return;
  try { parent.postMessage({ ...msg, frameId: cfg.frameId }, "*"); } catch (e) { /* ignore */ }
}

function showError(phase, message, stack) {
  errCard.hidden = false;
  errMsg.textContent = (message || "Unknown error") + (stack ? "\n\n" + String(stack).slice(0, 1400) : "");
  post({ type: "error", phase, message: String(message), stack: stack ? String(stack) : undefined });
}

function clearError() {
  if (!errCard.hidden) errCard.hidden = true;
}

async function loadModule(url) {
  // The parent pre-flighted this URL via &meta=1, so import directly.
  return import(url);
}

/* ---------------- image layers (plan §8: image source) ---------------- */

function bgImageLayer(cfgImage) {
  const { url, fit = "cover", position = "center", zoom = 1, blur = 0, dim = 0, opacity = 1 } = cfgImage;
  return React.createElement("div", {
    style: {
      position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none", opacity,
    },
  }, React.createElement("div", {
    style: {
      position: "absolute", inset: 0,
      backgroundImage: `url(${url})`,
      backgroundSize: fit === "contain" ? "contain" : fit === "fill" ? "100% 100%" : "cover",
      backgroundPosition: position,
      filter: blur ? `blur(${blur}px)` : undefined,
      transform: `scale(${zoom})`,
    },
  }), dim ? React.createElement("div", {
    style: { position: "absolute", inset: 0, background: `rgba(0,0,0,${dim})` },
  }) : null);
}

function overlayImageLayer(cfgImage) {
  const { url, x = 0, y = 0, width = 320, rotation = 0, opacity = 1, anchor = "top-left" } = cfgImage;
  const anchors = {
    "top-left": { left: x, top: y },
    "top-right": { right: x, top: y },
    "bottom-left": { left: x, bottom: y },
    "bottom-right": { right: x, bottom: y },
    center: { left: `calc(50% - ${width / 2}px + ${x}px)`, top: `calc(50% + ${y}px)` },
  };
  return React.createElement("img", {
    src: url,
    style: {
      position: "absolute", width, opacity, transform: rotation ? `rotate(${rotation}deg)` : undefined,
      ...(anchors[anchor] || anchors["top-left"]),
    },
  });
}

/* ---------------- React tree ---------------- */

class Boundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error) {
    showError("render", error && error.message ? error.message : String(error), error && error.stack);
  }
  render() {
    if (this.state.error) return null; // error card is plain DOM
    return this.props.children;
  }
}

function Composed() {
  const mode = cfg ? cfg.mode : "dark";
  const show = (cfg && cfg.show) || { bg: true, content: true, overlay: true };
  const bgLayer =
    (modules.bg && React.createElement(modules.bg)) ||
    (cfg && cfg.bgImage && bgImageLayer(cfg.bgImage)) ||
    null;
  const overlayLayer =
    (modules.overlay && React.createElement(modules.overlay)) ||
    (cfg && cfg.overlayImage && overlayImageLayer(cfg.overlayImage)) ||
    null;
  return React.createElement(
    "div",
    { className: "ss-stage", "data-theme": mode },
    [
      bgLayer && show.bg && React.createElement("div", { key: "bg", className: "ss-layer ss-bg" }, bgLayer),
      modules.slide && show.content && React.createElement("div", { key: "content", className: "ss-layer ss-content" }, React.createElement(Boundary, { key: "b" }, React.createElement(modules.slide))),
      overlayLayer && show.overlay && React.createElement("div", { key: "overlay", className: "ss-layer ss-overlay" }, overlayLayer),
    ].filter(Boolean),
  );
}

function renderTree() {
  root.render(React.createElement(Composed));
}

/* ---------------- apply a render config ---------------- */

async function applyConfig(next) {
  const prev = cfg;
  cfg = next;

  // theme css + mode + static + scale always applied
  const styleEl = document.getElementById("theme-style") || (() => {
    const s = document.createElement("style");
    s.id = "theme-style";
    document.head.appendChild(s);
    return s;
  })();
  styleEl.textContent = next.css || "";
  document.documentElement.dataset.theme = next.mode;
  rootEl.dataset.theme = next.mode;
  rootEl.classList.toggle("ss-static", !!next.static);
  rootEl.style.transform = `scale(${next.scale || 1})`;

  // a slide swap invalidates an open code viewer (stale markup) — close it
  if (next.slide !== moduleUrls.slide) closeCodeModal();

  stagesmith.initRuntime({
    staticMode: !!next.static,
    mode: next.mode,
    assetBase: next.assetBase || "",
    step: next.static ? 9999 : 0,
    slideIndex: next.slideIndex ?? 0,
    slideTotal: next.slideTotal ?? 0,
    declaredSteps: 1,
  });

  // hot-swap only changed modules (plan §5.1)
  try {
    if (next.bg !== moduleUrls.bg) {
      modules.bg = next.bg ? (await loadModule(next.bg)).default : null;
      moduleUrls.bg = next.bg;
    }
    if (next.commonOverlay !== moduleUrls.commonOverlay) {
      modules.commonOverlay = next.commonOverlay ? (await loadModule(next.commonOverlay)).default : null;
      moduleUrls.commonOverlay = next.commonOverlay;
    }
    if (next.overlay !== moduleUrls.overlay) {
      modules.overlay = next.overlay ? (await loadModule(next.overlay)).default : null;
      moduleUrls.overlay = next.overlay;
    }
    if (next.slide !== moduleUrls.slide) {
      modules.slide = next.slide ? (await loadModule(next.slide)).default : null;
      moduleUrls.slide = next.slide;
    }
  } catch (e) {
    // keep last good modules; show compile/import error (plan: preview keeps last good version)
    showError("import", e.message, e.stack);
    return;
  }

  // when an overlay override is active, <Common/> renders the common one
  stagesmith.__setCommonOverlay(
    next.overlay && next.overlay !== next.commonOverlay ? modules.commonOverlay : null,
  );

  // compile error with no last-good module → error card (fix-list item 4);
  // reported back with phase "compile" so the filmstrip does not double-count
  if (next.slideError) showError("compile", next.slideError);
  else clearError();
  renderTree();

  // report literal step count after paint
  requestAnimationFrame(() => {
    const steps = stagesmith.getState().declaredSteps;
    if (steps !== stepsReported) {
      stepsReported = steps;
      post({ type: "rendered", steps });
    }
  });
}

/* ---------------- code panels: expand button + fullscreen viewer ----------------
   Progressive enhancement of every .code block: an expand button is
   injected top-right; clicking opens the code in a fullscreen viewer inside
   the same sandbox document (deck theme + token colors preserved). The
   app relays clicks/hover for non-interactive stages via postMessage
   (see StageFrame) because pointer-events:none on the iframe blocks
   direct interaction. Skipped entirely in static/thumbnail mode. */

const EXP_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>';
const X_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>';

const codeBlocks = new Map(); // id → { name, tag, html }
let codeScanTimer = 0;
let codeModalEl = null;
let codeModalKey = null;
let lastBlocksMsg = "";

/** layout position in unscaled stage coords (transform-independent) */
function stagePos(el) {
  let x = 0, y = 0, node = el;
  while (node && node !== rootEl) { x += node.offsetLeft; y += node.offsetTop; node = node.offsetParent; }
  return { x, y };
}

function enhanceCodeBlocks() {
  if (!cfg || cfg.static) return;
  document.querySelectorAll(".code").forEach((block, i) => {
    const pre = block.querySelector("pre");
    if (!pre) return;
    let id = block.getAttribute("data-ss-code");
    if (!id) {
      id = "cb" + (i + 1) + "-" + Math.random().toString(36).slice(2, 7);
      block.setAttribute("data-ss-code", id);
    }
    if (!block.classList.contains("has-x")) {
      block.classList.add("has-x");
      const btn = document.createElement("button");
      btn.className = "ss-code-x";
      btn.type = "button";
      btn.dataset.id = id;
      btn.setAttribute("data-tip", "Fullscreen");
      btn.setAttribute("aria-label", "Open code fullscreen");
      btn.innerHTML = EXP_SVG;
      btn.addEventListener("click", (e) => { e.stopPropagation(); openCodeModal(id); });
      block.appendChild(btn);
    }
    const bar = block.querySelector(".code-bar");
    const nameEl = bar ? bar.querySelector("span") : null;
    const tagEl = bar ? bar.querySelector(".code-tag") : null;
    codeBlocks.set(id, {
      name: nameEl ? nameEl.textContent.trim() : "Code",
      tag: tagEl ? tagEl.textContent.trim() : "",
      html: pre.innerHTML,
    });
  });
  for (const id of Array.from(codeBlocks.keys())) {
    if (!document.querySelector('[data-ss-code="' + id + '"]')) codeBlocks.delete(id);
  }
  postCodeBlocks();
}

function postCodeBlocks() {
  if (!cfg || cfg.static) { lastBlocksMsg = ""; return; }
  const blocks = [];
  for (const [id] of codeBlocks) {
    const btn = document.querySelector('.ss-code-x[data-id="' + id + '"]');
    if (!btn) continue;
    const pos = stagePos(btn);
    blocks.push({ id, x: pos.x, y: pos.y, w: btn.offsetWidth, h: btn.offsetHeight });
  }
  const msg = JSON.stringify(blocks);
  if (msg === lastBlocksMsg) return; // stable → no spam on every mutation
  lastBlocksMsg = msg;
  post({ type: "code-blocks", blocks });
}

function openCodeModal(id) {
  const b = codeBlocks.get(id);
  if (!b) return;
  closeCodeModal();
  const overlay = document.createElement("div");
  overlay.className = "ss-code-modal";
  overlay.setAttribute("role", "dialog");
  overlay.setAttribute("aria-label", "Code viewer \u2014 Esc to close");
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeCodeModal(); });

  const card = document.createElement("div");
  card.className = "ss-code-modal-card";

  const bar = document.createElement("div");
  bar.className = "ss-code-modal-bar";
  const title = document.createElement("div");
  title.className = "ss-code-modal-title";
  const name = document.createElement("span");
  name.className = "ss-code-modal-name";
  name.textContent = b.name;
  title.appendChild(name);
  if (b.tag) {
    const tag = document.createElement("span");
    tag.className = "ss-code-modal-tag";
    tag.textContent = b.tag;
    title.appendChild(tag);
  }
  const close = document.createElement("button");
  close.className = "ss-code-modal-close";
  close.type = "button";
  close.title = "Close (Esc)";
  close.setAttribute("aria-label", "Close code viewer");
  close.innerHTML = X_SVG;
  close.addEventListener("click", closeCodeModal);
  bar.appendChild(title);
  bar.appendChild(close);

  const pre = document.createElement("pre");
  pre.className = "ss-code-modal-pre";
  pre.innerHTML = b.html; // tokenized spans → highlighting preserved
  pre.tabIndex = 0;

  card.appendChild(bar);
  card.appendChild(pre);
  overlay.appendChild(card);
  rootEl.appendChild(overlay); // inside the scaled stage → themed + scaled
  codeModalEl = overlay;

  codeModalKey = (e) => {
    if (e.key === "Escape") { e.stopPropagation(); closeCodeModal(); }
  };
  document.addEventListener("keydown", codeModalKey, true);
  post({ type: "code-modal", open: true });
}

function closeCodeModal() {
  if (codeModalKey) { document.removeEventListener("keydown", codeModalKey, true); codeModalKey = null; }
  if (!codeModalEl) return;
  codeModalEl.remove();
  codeModalEl = null;
  post({ type: "code-modal", open: false });
}

/* re-scan when the React tree mutates (slide swaps, Step reveals, hot edits) */
new MutationObserver(() => {
  clearTimeout(codeScanTimer);
  codeScanTimer = setTimeout(enhanceCodeBlocks, 120);
}).observe(rootEl, { childList: true, subtree: true });
enhanceCodeBlocks();

/* ---------------- messages from parent ---------------- */

window.addEventListener("message", (ev) => {
  const m = ev.data;
  if (!m || typeof m !== "object") return;
  if (m.type === "render") applyConfig(m);
  else if (m.type === "set-step") stagesmith.__setStep(m.step);
  else if (m.type === "open-code") openCodeModal(m.id);
  else if (m.type === "close-code") closeCodeModal();
  else if (m.type === "code-hover") {
    // relayed hover from the app (non-interactive stages): keep the
    // deck-themed button visuals in sync with the parent-side hotspot
    const btn = m.id && document.querySelector('.ss-code-x[data-id="' + m.id + '"]');
    if (btn) btn.classList.toggle("hover", !!m.on);
  } else if (m.type === "set-mode") {
    document.documentElement.dataset.theme = m.mode;
    if (rootEl) rootEl.dataset.theme = m.mode;
    stagesmith.__setMode(m.mode);
    renderTree();
  }
});

window.addEventListener("error", (e) => {
  if (e.error || e.message) showError("runtime", e.message || String(e.error), e.error && e.error.stack);
});
window.addEventListener("unhandledrejection", (e) => {
  const r = e.reason;
  if (r && (r.message || r instanceof Error)) showError("runtime", r.message || String(r), r.stack);
});

/* ready — RETRIED until the parent sends the first render config.
   Iframes present in the server-rendered HTML boot during parsing and can
   fire ready BEFORE hydration attaches the app's message listener; without
   the retry the handshake is lost and the stage stays blank forever. */
const frameParam = new URLSearchParams(location.search).get("f") || "boot";
function postReady() {
  try { parent.postMessage({ type: "ready", frameId: frameParam }, "*"); } catch (e) { /* ignore */ }
}
postReady();
// retry until the first config arrives — see the comment above
let readyTries = 0;
const readyTimer = setInterval(() => {
  if (cfg || ++readyTries > 40) { clearInterval(readyTimer); return; }
  postReady();
}, 250);

} // end __ssInstance guard
</script>
</body>
</html>

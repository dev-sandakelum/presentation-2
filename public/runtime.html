<!DOCTYPE html>
<html lang="en">
<head>

<title>Stagesmith Stage Runtime</title>
<script type="importmap">
{
  "imports": {
    "react": "/api/vendor/react.js?v=__V__",
    "react/jsx-runtime": "/api/vendor/react-jsx-runtime.js?v=__V__",
    "react-dom/client": "/api/vendor/react-dom.js?v=__V__",
    "stagesmith": "/api/vendor/stagesmith.js?v=__V__",
    "lucide-react": "/api/vendor/lucide-react.js?v=__V__"
  }
}
</script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}
  #root{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0}
  /* theme CSS injects `#root { background: var(--bg) }` for the base color,
     but background transitions must be handled exclusively by the bg-slot
     crossfade system — no CSS transition on background-color. The base
     #root color is fine as a static fallback (shows only if no bg slot
     covers it); it must NOT animate on its own. */
  .ss-stage{position:absolute;inset:0;overflow:hidden}
  .ss-layer{position:absolute;inset:0}
  .ss-bg{z-index:0}
  .ss-content{z-index:1}
  .ss-overlay{z-index:2;pointer-events:none}
  /* background crossfade slots — stacked siblings, later ones paint on top */
  .ss-bg-slot{position:absolute;inset:0}
  .ss-static *{animation:none !important;transition:none !important}
  #errcard{
    position:absolute;left:40px;top:40px;right:40px;z-index:50;
    background:#14100e;color:#fca5a5;border:1px solid #7f1d1d;border-radius:12px;
    padding:22px 26px;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;
    white-space:pre-wrap;word-break:break-word;pointer-events:none;
  }
  #errcard .err-head{
    color:#f87171;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:11px;margin-bottom:10px;
  }
  /* background transitions are handled by the bg-slot crossfade system,
     not by CSS transitions on #root — keeps bg changes in sync with the
     slide entry/exit choreography and avoids a jarring color flash. */
</style>
</head>
<body>
<div id="root"></div>
<div id="errcard" hidden><div class="err-head">Slide error</div><pre id="errmsg" style="margin:0;font:inherit;color:inherit;white-space:inherit"></pre></div>
<script>
/* boot watchdog — reports module load failures back to the parent */
window.__ssErrors = [];
window.addEventListener("error", function (e) {
  window.__ssErrors.push(String(e.message || e.error));
  try { parent.postMessage({ type: "boot-error", frameId: new URLSearchParams(location.search).get("f") || "boot", message: String(e.message || e.error) }, "*"); } catch (err) {}
});
window.addEventListener("unhandledrejection", function (e) {
  var r = e.reason;
  var msg = r && r.message ? r.message : String(r);
  window.__ssErrors.push(msg);
  try { parent.postMessage({ type: "boot-error", frameId: new URLSearchParams(location.search).get("f") || "boot", message: msg }, "*"); } catch (err) {}
});
</script>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import * as stagesmith from "stagesmith";

try { parent.postMessage({ type: "boot-ok", frameId: new URLSearchParams(location.search).get("f") || "boot" }, "*"); } catch (e) {}

/* ==================================================================
   Present-mode transitions (three-layer stage).

   The stage is three stable layers that live for the whole deck:

     .ss-bg       background stack (crossfade slots, old below, new above)
     .ss-content  the slide itself (exit / enter animations)
     .ss-overlay  header/footer/marks — NEVER animated, never remounted

   A slide change that arrives with a `transition` directive runs a small
   state machine, driven by ONE controller so every input path (keyboard,
   click zones, dot nav, overview grid, phone remote) behaves identically:

     idle → exiting → (bgChanging, only when the bg KEY differs) → entering → idle

   Ordering rules:
     - different background: the old content leaves FIRST, then the
       background crossfades (old kept below until the new one is fully
       visible), then the new content enters — never the other way round
     - same background (key equal by VALUE): the background layer is not
       touched at all — no fade, no remount, no flicker
     - the overlay layer is never part of any animation; it is React.memo'd
       so slide changes don't even re-render it (store subscriptions —
       progress bar, slide numbers — keep flowing)
   Rapid input never queues: a newer config interrupts the running
   transition deterministically (running crossfades snap forward, the exit
   animation is adopted because it is target-independent) and the machine
   goes straight to the latest target. Only transform and opacity are
   animated; will-change is set while animating and cleared when idle.
   ================================================================== */

// guard against double module execution in the same document
if (window.__ssInstance) {
  // already booted — re-post ready so the parent can re-send its config
  try { parent.postMessage({ type: "ready", frameId: new URLSearchParams(location.search).get("f") || "boot" }, "*"); } catch (e) {}
} else {
  window.__ssInstance = true;

const rootEl = document.getElementById("root");
const root = createRoot(rootEl);
const errCard = document.getElementById("errcard");
const errMsg = document.getElementById("errmsg");

let cfg = null;                 // last received render config
const modules = { slide: null, overlay: null, commonOverlay: null };
const bgStack = [];             // visible background slots, bottom → top
const modCache = new Map();     // layer module key → Promise<component>
const memoCache = new WeakMap();// component → React.memo wrapper
let stepsReported = -1;
let lastJson = null;            // identical-config guard (heal re-posts)
let lastApplied = null;         // layer keys of the currently visible world

/* ---------------- transition state ---------------- */
let transToken = 0;             // bumped by every applyConfig — coroutines bail when superseded
let run = null;                 // { token, keys, cfg } — the active transition
let exitAnim = null;            // content → hidden (shared across retargets: target-independent)
let enterAnim = null;           // content → visible
let bgFades = [];               // running bg slot fades [{ anim, entry }]
let queuedStep = null;          // set-step received while a transition runs

const REDUCED = "(prefers-reduced-motion: reduce)";
function isReduced() { return window.matchMedia(REDUCED).matches; }

/* ---------------- helpers ---------------- */

function post(msg) {
  if (!cfg) return;
  try { parent.postMessage({ ...msg, frameId: cfg.frameId }, "*"); } catch (e) { /* ignore */ }
}

function showPhase(phase, extra) {
  post({ type: "transition", phase, ...(extra || {}) });
  try { console.debug("[ss-transition]", phase, extra || ""); } catch (e) {}
}

function showError(phase, message, stack) {
  errCard.hidden = false;
  errMsg.textContent = (message || "Unknown error") + (stack ? "\n\n" + String(stack).slice(0, 1400) : "");
  post({ type: "error", phase, message: String(message), stack: stack ? String(stack) : undefined });
}

function clearError() {
  if (!errCard.hidden) errCard.hidden = true;
}

async function loadModule(url) {
  // The parent pre-flighted this URL via &meta=1, so import directly.
  return import(url);
}

/** import a module shipped as raw compiled JS (browser-stored decks —
 *  the parent compiled it via POST /api/compile and passes the code in
 *  the render config). Blob URLs work inside the opaque-origin sandbox. */
async function loadCodeModule(code) {
  const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
  try {
    return await import(url);
  } finally {
    URL.revokeObjectURL(url); // module is evaluated — the URL is spent
  }
}

/** normalize a layer of the config to { key, url?, code? } | null */
function layerRef(next, kind) {
  if (next[kind]) return { key: "url:" + next[kind], url: next[kind] };
  const code = next[kind + "Code"];
  if (code) return { key: "ver:" + (next[kind + "Ver"] || String(code.length)), code };
  return null;
}

/** component of a layer module, imported once per key (cached) */
function ensureMod(ref) {
  let p = modCache.get(ref.key);
  if (!p) {
    p = (ref.url ? loadModule(ref.url) : loadCodeModule(ref.code)).then((m) => m.default ?? null);
    p.catch(() => modCache.delete(ref.key)); // allow a retry on the next config
    modCache.set(ref.key, p);
  }
  return p;
}

/** React.memo a layer component once, so re-renders skip unchanged layers */
function memoComp(Comp) {
  if (!Comp || typeof Comp !== "function") return Comp;
  let m = memoCache.get(Comp);
  if (!m) { m = React.memo(Comp); memoCache.set(Comp, m); }
  return m;
}

function refKey(ref) { return ref ? ref.key : null; }

/** value-based layer keys — string comparison, never object identity */
function keysOf(next) {
  const bgRef = layerRef(next, "bg");
  const ovRef = layerRef(next, "overlay");
  return {
    slide: refKey(layerRef(next, "slide")),
    bg: bgRef ? bgRef.key : next.bgImage ? "img:" + JSON.stringify(next.bgImage) : "none",
    overlay: ovRef ? ovRef.key : next.overlayImage ? "img:" + JSON.stringify(next.overlayImage) : null,
    commonOverlay: refKey(layerRef(next, "commonOverlay")),
  };
}

function sameKeys(a, b) {
  return !!a && !!b && a.slide === b.slide && a.bg === b.bg && a.overlay === b.overlay && a.commonOverlay === b.commonOverlay;
}

/* ---------------- asset load healing (Problem 06) ----------------
   Slide/overlay code may reference images by RAW paths ("assets/bg.png")
   or by a stale /api/assets/<other-deck>/... URL copied from another deck.
   In the sandbox those resolve against /runtime and 404. When a resource
   fails, retry it through the deck's asset map (browser decks: data URLs)
   or the deck's own asset route (assetBase). Runs once per element. */
(function () {
  var healed = new WeakSet();
  function candidatePath(rawUrl) {
    var u;
    try { u = new URL(rawUrl, location.href); } catch (e) { return null; }
    var p = decodeURIComponent(u.pathname).replace(/\/+$/, "");
    var m = p.match(/^\/api\/assets\/[^/]+\/(.+)$/); // /api/assets/<deckId>/<rest>
    if (m) return m[1];
    return p.replace(/^\//, "");                      // site-relative path
  }
  window.addEventListener("error", function (e) {
    var el = e.target;
    if (!el || el === window || healed.has(el)) return;
    var tag = el.tagName;
    var attr = tag === "IMG" || tag === "VIDEO" || tag === "AUDIO" || tag === "SOURCE" || tag === "SCRIPT" || tag === "IMAGE"
      ? "src" : tag === "LINK" ? "href" : null;
    if (!attr) return;
    var raw = el.getAttribute && el.getAttribute(attr);
    if (!raw || /^(data|blob):/i.test(raw)) return;
    healed.add(el);
    var path = candidatePath(raw);
    if (!path) return;
    var map = cfg && cfg.assetMap;
    var mapped = map ? map[path] : undefined;
    if (mapped) { el.setAttribute(attr, mapped); return; }
    // fall back to THIS deck's asset route (server decks; differs from the failed URL)
    var base = cfg && cfg.assetBase;
    if (base && path.indexOf("..") < 0 && !path.startsWith("/")) {
      var next = base + "/" + path.split("/").map(encodeURIComponent).join("/");
      var abs;
      try { abs = new URL(next, location.href).href; } catch (err) { return; }
      var failed;
      try { failed = new URL(raw, location.href).href; } catch (err) { return; }
      if (abs !== failed) el.setAttribute(attr, next);
    }
  }, true);
})();

/* ---------------- image layers (plan §8: image source) ---------------- */

function bgImageLayer(cfgImage) {
  const { url, fit = "cover", position = "center", zoom = 1, blur = 0, dim = 0, opacity = 1 } = cfgImage;
  return React.createElement("div", {
    style: {
      position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none", opacity,
    },
  }, React.createElement("div", {
    style: {
      position: "absolute", inset: 0,
      backgroundImage: `url(${url})`,
      backgroundSize: fit === "contain" ? "contain" : fit === "fill" ? "100% 100%" : "cover",
      backgroundPosition: position,
      filter: blur ? `blur(${blur}px)` : undefined,
      transform: `scale(${zoom})`,
    },
  }), dim ? React.createElement("div", {
    style: { position: "absolute", inset: 0, background: `rgba(0,0,0,${dim})` },
  }) : null);
}

function overlayImageLayer(cfgImage) {
  const { url, x = 0, y = 0, width = 320, rotation = 0, opacity = 1, anchor = "top-left" } = cfgImage;
  const anchors = {
    "top-left": { left: x, top: y },
    "top-right": { right: x, top: y },
    "bottom-left": { left: x, bottom: y },
    "bottom-right": { right: x, bottom: y },
    center: { left: `calc(50% - ${width / 2}px + ${x}px)`, top: `calc(50% + ${y}px)` },
  };
  return React.createElement("img", {
    src: url,
    style: {
      position: "absolute", width, opacity, transform: rotation ? `rotate(${rotation}deg)` : undefined,
      ...(anchors[anchor] || anchors["top-left"]),
    },
  });
}

/* ---------------- background stack ---------------- */

/** resolve the target background of a config to a mountable descriptor */
async function ensureBgEntry(next) {
  if (next.bgImage) {
    await decodeUrl(next.bgImage.url); // never pop in — decode before mount
    return { key: "img:" + JSON.stringify(next.bgImage), kind: "image", image: next.bgImage };
  }
  const ref = layerRef(next, "bg");
  if (!ref) return null;
  const comp = await ensureMod(ref);
  if (!comp) throw new Error("Background module has no default export");
  return { key: ref.key, kind: "module", comp };
}

function makeBgEntry(target, hidden) {
  const entry = {
    key: target.key,
    makeNode: target.kind === "image"
      ? () => bgImageLayer(target.image)
      : () => React.createElement(memoComp(target.comp)),
    el: null,
    fadeStarted: false, // committed once its fade has begun
    dying: false,       // fading out (target has no background)
    // incoming slots start invisible so they never flash at full opacity
    // before fadeSlot() gets to animate them in
    hidden: !!hidden,
    setEl: null,
  };
  entry.setEl = (el) => {
    entry.el = el;
    // apply the hidden state immediately on mount — the ref callback fires
    // synchronously after React commits, before the browser paints, so the
    // element is opacity:0 on the very first frame it is composited
    if (el && entry.hidden) el.style.opacity = "0";
  };
  return entry;
}

/** key of the topmost visible (not dying) background slot */
function currentBgKey() {
  for (let i = bgStack.length - 1; i >= 0; i--) {
    if (!bgStack[i].dying) return bgStack[i].key;
  }
  return "none";
}

/** fade one bg slot (opacity only) */
function fadeSlot(entry, from, to, ms) {
  const el = entry.el;
  if (!el) return null;
  el.style.willChange = "opacity";
  el.style.opacity = String(from);
  const a = el.animate([{ opacity: from }, { opacity: to }], { duration: ms, easing: "ease" });
  a.finished.then(() => {
    el.style.opacity = to === 1 ? "" : "0";
    el.style.willChange = "";
    try { a.cancel(); } catch (e) {}
  }).catch(() => {});
  return a;
}

/** snap every running bg fade to its end state and prune the stack:
 *  keep the topmost slot whose fade has started (or the base slot),
 *  drop superseded slots below it and never-started incomings above it */
function settleBg() {
  for (const a of bgFades) { try { a.finish(); } catch (e) {} }
  bgFades = [];
  let keep = -1;
  for (let i = 0; i < bgStack.length; i++) {
    const e = bgStack[i];
    if (e.dying) continue;
    if (e.fadeStarted) keep = i;
  }
  if (keep < 0 && bgStack.length && !bgStack[0].dying) keep = 0;
  const next = keep >= 0 ? [bgStack[keep]] : [];
  if (next.length !== bgStack.length) {
    bgStack.length = 0;
    bgStack.push(...next);
    renderTree();
  }
}

/* ---------------- content layer animations ---------------- */

let contentEl = null;
function setContentEl(el) { contentEl = el; }

/** force the content layer back to its visible resting state — used when a
 *  running transition is superseded by an INSTANT apply (live edit, jumping
 *  back to the outgoing slide, reduced motion) so a half-finished exit can
 *  never leave the stage dark. */
function revealContent() {
  if (exitAnim) { try { exitAnim.cancel(); } catch (e) {} exitAnim = null; }
  if (enterAnim) { try { enterAnim.cancel(); } catch (e) {} enterAnim = null; }
  const el = contentEl;
  if (el) {
    el.style.opacity = "";
    el.style.transform = "";
    el.style.willChange = "";
    el.dataset.hidden = "";
  }
}

/** exit: content → hidden. Returns the WAAPI animation (or null when
 *  already hidden). A running exit is ADOPTED by retargeted transitions —
 *  it is target-independent, so rapid input never restarts it. */
function startExit(t) {
  if (exitAnim) return exitAnim;
  const el = contentEl;
  if (!el || el.dataset.hidden === "1") return null;
  const from = {
    opacity: el.style.opacity || "1",                             // may be a captured mid-enter state
    transform: el.style.transform || "translateX(0px)",
  };
  el.style.willChange = "transform, opacity";
  const outX = t.dir === "prev" ? 36 : -36;                       // content leaves against the travel direction
  const a = el.animate(
    [
      { opacity: from.opacity, transform: from.transform },
      { opacity: 0, transform: `translateX(${outX}px)` },
    ],
    { duration: t.exitMs, easing: "cubic-bezier(.5,0,.6,1)" },
  );
  exitAnim = a;
  a.finished.then(() => {
    if (exitAnim === a) {
      exitAnim = null;
      el.style.opacity = "0";
      el.dataset.hidden = "1";
      el.style.willChange = "";
      try { a.cancel(); } catch (e) {} // reverts to the inline opacity:0 above
    }
  }).catch(() => { if (exitAnim === a) exitAnim = null; });
  return a;
}

async function waitExit() {
  const a = exitAnim;
  if (!a) return;
  try { await a.finished; } catch (e) {}
}

/** enter: content → visible, gliding in from the travel direction */
async function startEnter(t) {
  const el = contentEl;
  if (!el) return;
  el.dataset.hidden = "";
  el.style.willChange = "transform, opacity";
  el.style.opacity = "0"; // hidden until the animation takes over (it wins over inline styles)
  const inX = t.dir === "next" ? 36 : -36;
  const a = el.animate(
    [
      { opacity: 0, transform: `translateX(${inX}px)` },
      { opacity: 1, transform: "translateX(0px)" },
    ],
    { duration: t.enterMs, easing: "cubic-bezier(.22,1,.36,1)" },
  );
  enterAnim = a;
  try {
    await a.finished;
  } catch (e) {
    return; // cancelled by an interrupt — the interrupt owns the visuals
  }
  if (enterAnim === a) {
    enterAnim = null;
    el.style.opacity = "";
    el.style.transform = "";
    el.style.willChange = "";
    try { a.cancel(); } catch (e) {}
  }
}

/* ---------------- paint readiness (no pop-ins) ---------------- */

function nextPaint() {
  return new Promise((res) => {
    if (document.hidden) return res();
    requestAnimationFrame(() => (document.hidden ? res() : requestAnimationFrame(res)));
  });
}

/** decode a URL before it is mounted (image-source backgrounds) */
function decodeUrl(url) {
  return new Promise((res) => {
    if (!url || /^(data|blob):/i.test(url)) return res();
    const img = new Image();
    const done = () => res();
    img.onload = () => (img.decode ? img.decode().then(done, done) : done());
    img.onerror = done;
    img.src = url;
  });
}

/** wait until a freshly mounted layer is fully paintable:
 *  fonts loaded + every <img> inside decoded + one committed frame */
async function ensurePaintable(entry) {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  const el = entry && entry.el;
  if (!el || document.hidden) return;
  const imgs = Array.from(el.querySelectorAll("img"));
  await Promise.all(imgs.map((img) => {
    if (img.complete && img.naturalWidth > 0) return null;
    return new Promise((res) => {
      const done = () => res();
      img.addEventListener("load", () => (img.decode ? img.decode().then(done, done) : done()), { once: true });
      img.addEventListener("error", done, { once: true });
    });
  }));
  await nextPaint();
}

/* ---------------- React tree ---------------- */

class Boundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error) {
    showError("render", error && error.message ? error.message : String(error), error && error.stack);
  }
  render() {
    if (this.state.error) return null; // error card is plain DOM
    return this.props.children;
  }
}

function Composed() {
  const mode = cfg ? cfg.mode : "dark";
  const show = (cfg && cfg.show) || { bg: true, content: true, overlay: true };
  const kids = [];
  // background layer — stable stack of slots (old below, new above)
  if (show.bg && bgStack.length) {
    kids.push(React.createElement("div", { key: "bg", className: "ss-layer ss-bg" },
      bgStack.map((e) => React.createElement("div", {
        key: e.key, className: "ss-bg-slot", ref: e.setEl,
      }, e.makeNode()))));
  }
  // content layer — one stable div; the slide module swaps while it is hidden
  if (show.content) {
    kids.push(React.createElement("div", { key: "content", className: "ss-layer ss-content", ref: setContentEl },
      modules.slide
        ? React.createElement(Boundary, { key: "b" }, React.createElement(modules.slide))
        : null));
  }
  // overlay layer — never animated, never remounted; React.memo keeps slide
  // changes from re-rendering it at all (store updates still flow through)
  const overlayNode = modules.overlay
    ? React.createElement(memoComp(modules.overlay))
    : (cfg && cfg.overlayImage ? overlayImageLayer(cfg.overlayImage) : null);
  if (show.overlay && overlayNode) {
    kids.push(React.createElement("div", { key: "overlay", className: "ss-layer ss-overlay" }, overlayNode));
  }
  return React.createElement("div", { className: "ss-stage", "data-theme": mode }, kids);
}

function renderTree() {
  root.render(React.createElement(Composed));
  // paint marker — the headless verification harness waits for this
  try { window.__ssRendered = (window.__ssRendered || 0) + 1; } catch (e) {}
}

/* ---------------- apply a render config ---------------- */

function themeStyle() {
  return document.getElementById("theme-style") || (() => {
    const s = document.createElement("style");
    s.id = "theme-style";
    document.head.appendChild(s);
    return s;
  })();
}

/** theme css, mode, static freeze and the runtime store (slide index for
 *  the overlay's progress bar, step for the incoming slide) */
function applyChrome(next) {
  const styleEl = themeStyle();
  styleEl.textContent = next.css || "";
  document.documentElement.dataset.theme = next.mode;
  rootEl.dataset.theme = next.mode;
  rootEl.classList.toggle("ss-static", !!next.static);
  stagesmith.initRuntime({
    staticMode: !!next.static,
    mode: next.mode,
    assetBase: next.assetBase || "",
    assetMap: next.assetMap || null,
    step: next.static ? 9999 : (queuedStep ?? 0),
    slideIndex: next.slideIndex ?? 0,
    slideTotal: next.slideTotal ?? 0,
    declaredSteps: 1,
  });
  queuedStep = null;
}

function reportSteps() {
  stepsReported = -1; // report once per applied slide
  requestAnimationFrame(() => {
    const steps = stagesmith.getState().declaredSteps;
    if (steps !== stepsReported) {
      stepsReported = steps;
      post({ type: "rendered", steps });
    }
  });
}

/** crossfade the background to the target key. The old slot keeps running
 *  below the whole time and is only dropped once the new one is fully
 *  visible. If the target has no background, the current one fades out. */
async function crossfadeBg(next, keys, t, my) {
  settleBg();
  if (currentBgKey() === keys.bg) return; // defensive — caller already checked
  let target = null;
  let failed = null;
  try {
    target = await ensureBgEntry(next);
  } catch (e) {
    failed = e; // keep the old background, surface the error, continue
  }
  if (my !== transToken) return;
  if (failed) { showError("import", failed.message, failed.stack); return; }

  if (!target) {
    // target slide has NO background — fade the current one out
    const top = bgStack.filter((e) => !e.dying).pop();
    if (top) {
      top.dying = true;
      showPhase("bg", { to: "none" });
      const a = fadeSlot(top, 1, 0, t.bgMs);
      if (a) { bgFades.push(a); try { await a.finished; } catch (e) {} }
      if (my !== transToken) { settleBg(); return; }
    }
    settleBg();
    return;
  }

  // mount the incoming slot hidden, wait until it is paintable, then fade
  const entry = makeBgEntry(target, true /* hidden until fade starts */);
  bgStack.push(entry);
  renderTree();
  await nextPaint(); // refs attached
  if (my !== transToken) { settleBg(); return; }
  await ensurePaintable(entry);
  if (my !== transToken) { settleBg(); return; }
  entry.fadeStarted = true;
  showPhase("bg", { to: entry.key });
  const a = fadeSlot(entry, 0, 1, t.bgMs);
  if (a) {
    bgFades.push(a);
    try { await a.finished; } catch (e) {}
  }
  if (my !== transToken) { settleBg(); return; }
  settleBg(); // drop the old slot — the new one is fully visible
}

/** assign the target slide/overlay modules (bg already handled by the
 *  crossfade) and re-render. Imports resolve from the cache warmed during
 *  the exit phase. */
async function swapLayers(target, keys, my) {
  const refs = {
    slide: layerRef(target, "slide"),
    overlay: layerRef(target, "overlay"),
    commonOverlay: layerRef(target, "commonOverlay"),
  };
  const comps = {};
  for (const kind of ["overlay", "commonOverlay", "slide"]) {
    comps[kind] = refs[kind] ? await ensureMod(refs[kind]) : null;
  }
  if (my !== transToken) return; // superseded mid-import — nothing assigned
  modules.slide = comps.slide;
  modules.overlay = comps.overlay;
  modules.commonOverlay = comps.commonOverlay;
  stagesmith.__setCommonOverlay(
    refs.overlay && refs.commonOverlay && refs.overlay.key !== refs.commonOverlay.key
      ? modules.commonOverlay
      : null,
  );
  if (target.slideError) showError("compile", target.slideError);
  else clearError();
  renderTree();
}

/** instant application (editor previews, thumbnails, first config,
 *  reduced motion, live edits) — the pre-transition behaviour */
async function applyInstant(next, keys, my) {
  revealContent(); // a superseded transition may have left the content half-exited
  applyChrome(next);
  settleBg();
  try {
    const target = await ensureBgEntry(next);
    if (my !== transToken) return;
    const refs = {
      slide: layerRef(next, "slide"),
      overlay: layerRef(next, "overlay"),
      commonOverlay: layerRef(next, "commonOverlay"),
    };
    const comps = {};
    for (const kind of ["overlay", "commonOverlay", "slide"]) {
      comps[kind] = refs[kind] ? await ensureMod(refs[kind]) : null;
    }
    if (my !== transToken) return;
    // assign atomically (bg only when a module/image target resolved)
    if (target) {
      bgStack.length = 0;
      bgStack.push(makeBgEntry(target));
    } else if (!next.bgImage && !layerRef(next, "bg")) {
      bgStack.length = 0; // explicit "no background"
    }
    modules.slide = comps.slide;
    modules.overlay = comps.overlay;
    modules.commonOverlay = comps.commonOverlay;
    stagesmith.__setCommonOverlay(
      refs.overlay && refs.commonOverlay && refs.overlay.key !== refs.commonOverlay.key
        ? modules.commonOverlay
        : null,
    );
    if (next.slideError) showError("compile", next.slideError);
    else clearError();
  } catch (e) {
    // keep the last good layers (plan: preview keeps the last good version)
    showError("import", e.message, e.stack);
  }
  renderTree();
  reportSteps();
  showPhase("instant");
}

/** deterministic take-over when a newer config supersedes the running
 *  transition: freeze a mid-enter content layer at its CURRENT visuals,
 *  let the target-independent exit keep running (the next transition
 *  adopts it), and snap background fades forward to their end state. */
function interruptTransition() {
  const r = run;
  run = null;
  if (!r) return;
  r.cancelled = true; // the superseded coroutine bails at its next checkpoint
  showPhase("interrupt", { from: r.keys.bg });
  if (enterAnim) {
    const el = contentEl;
    if (el) {
      const cs = getComputedStyle(el);
      if (cs.opacity !== "") el.style.opacity = cs.opacity;
      if (cs.transform && cs.transform !== "none") el.style.transform = cs.transform;
      el.dataset.hidden = "";
    }
    try { enterAnim.cancel(); } catch (e) {}
    enterAnim = null;
  }
  settleBg(); // snap running bg fades forward, prune un-started incomings
}

/** the transition controller — ONE code path for every way of changing
 *  slides (keyboard, click, dot nav, overview grid, phone remote): they
 *  all arrive here as a render config with a transition directive. */
async function runTransition(next, keys, t, my) {
  run = { token: my, keys, cfg: next };
  showPhase("start", { dir: t.dir, bgChanged: currentBgKey() !== keys.bg });

  // 1. EXIT — only the content layer leaves; bg and overlay untouched.
  //    Target modules import concurrently (cache-warm from preloading).
  const preload = [];
  for (const kind of ["overlay", "commonOverlay", "slide"]) {
    const ref = layerRef(next, kind);
    if (ref) preload.push(ensureMod(ref).catch(() => {}));
  }
  startExit(t);
  await waitExit();
  if (my !== transToken) return;

  // 2. chrome (theme css, mode, store) applies while the content is hidden,
  //    so colours never flip under visible content.
  const target = run.cfg || next; // a chrome refresh during the run wins
  applyChrome(target);

  // 3. BACKGROUND — crossfade only when the bg key differs (Case A);
  //    identical keys leave the layer completely untouched (Case B).
  if (currentBgKey() !== keys.bg) {
    await crossfadeBg(target, keys, t, my);
    if (my !== transToken) return;
  }

  // 4. ENTER — swap the slide module (overlay swaps instantly too, only
  //    when its key changed), then glide the content in. Re-read run.cfg so
  //  a chrome refresh posted mid-run is the one applied.
  try {
    await swapLayers((run && run.cfg) || target, keys, my);
  } catch (e) {
    // an import failed mid-transition: keep the last good layers, show the
    // error and bring the current content back — never a stuck hidden stage.
    showError("import", e.message, e.stack);
  }
  if (my !== transToken) return;
  showPhase("enter", { dir: t.dir });
  await nextPaint(); // React committed, refs attached
  if (my !== transToken) return;
  await startEnter(t);
  if (my !== transToken) return;
  reportSteps();
  showPhase("done");
}

async function applyConfig(next) {
  const json = JSON.stringify(next);
  if (json === lastJson) return; // redundant re-post (heal heartbeat) — nothing to do

  // a config matching the RUNNING transition's target is owned by it —
  // only refresh its chrome (e.g. a mode toggle posted mid-transition);
  // the visual bits apply right away, the store bits at the next applyChrome.
  // NOTE: no token is consumed here — the running coroutine must keep
  // ownership of the world; a chrome refresh must never kill it.
  const keys = keysOf(next);
  if (run && sameKeys(run.keys, keys)) {
    cfg = next;
    lastJson = json;
    rootEl.style.transform = `scale(${next.scale || 1})`; // resize is not a slide transition
    themeStyle().textContent = next.css || "";
    document.documentElement.dataset.theme = next.mode;
    rootEl.dataset.theme = next.mode;
    run.cfg = next;
    return;
  }
  const my = ++transToken;
  cfg = next;
  rootEl.style.transform = `scale(${next.scale || 1})`; // resize is not a slide transition

  if (run) {
    interruptTransition(); // rapid input: finish/skip forward, never queue
    if (my !== transToken) return;
  }

  lastJson = json;
  const t = next.transition;
  const reduced = isReduced() || !!(t && t.reduced);
  if (t && lastApplied && !sameKeys(lastApplied, keys) && !reduced) {
    try {
      await runTransition(next, keys, t, my);
    } catch (e) {
      // safety net — never leave the stage dark because of an internal error
      showError("runtime", e && e.message ? e.message : String(e), e && e.stack);
      revealContent();
      renderTree();
    }
    if (run && run.token === my) {
      run = null;
      lastApplied = keys;
    }
  } else {
    if (t && reduced) showPhase("skip", { reason: "reduced-motion" });
    await applyInstant(next, keys, my);
    if (my !== transToken) return;
    lastApplied = keys;
  }
}

/* ---------------- messages from parent ---------------- */

window.addEventListener("message", (ev) => {
  const m = ev.data;
  if (!m || typeof m !== "object") return;
  if (m.type === "render") applyConfig(m);
  else if (m.type === "set-step") {
    // during a transition the step belongs to the incoming slide — apply
    // it in applyChrome, after the store was reset for the new slide
    if (run) queuedStep = m.step;
    else stagesmith.__setStep(m.step);
  } else if (m.type === "set-mode") {
    if (run) {
      if (cfg) cfg.mode = m.mode;
      if (run.cfg) run.cfg.mode = m.mode;
    }
    document.documentElement.dataset.theme = m.mode;
    if (rootEl) rootEl.dataset.theme = m.mode;
    stagesmith.__setMode(m.mode);
    if (!run) renderTree();
  }
});

window.addEventListener("error", (e) => {
  if (e.error || e.message) showError("runtime", e.message || String(e.error), e.error && e.error.stack);
});
window.addEventListener("unhandledrejection", (e) => {
  const r = e.reason;
  if (r && (r.message || r instanceof Error)) showError("runtime", r.message || String(r), r.stack);
});

/* ready */
const frameParam = new URLSearchParams(location.search).get("f") || "boot";
try {
  parent.postMessage({ type: "ready", frameId: frameParam }, "*");
} catch (e) { /* ignore */ }

} // end __ssInstance guard
</script>

<script>
/* ---- Code block: fullscreen viewer (item 3) ----
   Inject .code-expand buttons into every .code-bar after each render,
   and handle opening/closing the .code-viewer modal entirely inside
   the sandboxed iframe (no popup, no cross-origin issues). */
(function () {
  "use strict";

  // SVG expand icon (inline, no external dependency)
  var EXPAND_SVG = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 1.5H10.5V4.5"/><path d="M10.5 1.5L6.5 5.5"/><path d="M4.5 10.5H1.5V7.5"/><path d="M1.5 10.5L5.5 6.5"/></svg>';
  // SVG close icon
  var CLOSE_SVG = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg>';

  var viewer = null; // the .code-viewer element when open

  function closeViewer() {
    if (!viewer) return;
    viewer.remove();
    viewer = null;
  }

  function openViewer(codeEl) {
    // Collect the bar label (first text span in .code-bar)
    var bar = codeEl.querySelector(".code-bar");
    var label = bar ? (bar.querySelector(":not(.code-expand):not(.code-tag)")?.textContent?.trim() || "") : "";
    // Collect the <pre> inner HTML (preserves span token markup)
    var pre = codeEl.querySelector("pre");
    var html = pre ? pre.innerHTML : "";

    closeViewer();

    viewer = document.createElement("div");
    viewer.className = "code-viewer";
    viewer.setAttribute("role", "dialog");
    viewer.setAttribute("aria-modal", "true");
    viewer.setAttribute("aria-label", label || "Code viewer");
    viewer.innerHTML =
      '<div class="code-viewer-bar">' +
        '<span>' + (label || "Code") + '</span>' +
        '<button class="code-viewer-close" title="Close fullscreen (Esc)">' + CLOSE_SVG + '</button>' +
      '</div>' +
      '<pre></pre>';

    // Copy the inner HTML into the pre so token spans are preserved
    viewer.querySelector("pre").innerHTML = html;

    viewer.querySelector(".code-viewer-close").addEventListener("click", closeViewer);

    document.body.appendChild(viewer);
    viewer.querySelector("pre").focus && viewer.querySelector("pre").setAttribute("tabindex", "0");
  }

  // Esc key closes the viewer
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && viewer) {
      e.stopPropagation();
      closeViewer();
    }
  }, true);

  // Click outside viewer content closes it
  document.addEventListener("click", function (e) {
    if (viewer && e.target === viewer) closeViewer();
  });

  // Inject .code-expand buttons into every .code-bar that doesn't have one yet.
  // Called after each render via MutationObserver.
  function injectExpandButtons() {
    // Skip in static/thumbnail mode
    if (document.getElementById("root") && document.getElementById("root").classList.contains("ss-static")) return;
    var bars = document.querySelectorAll(".code-bar");
    for (var i = 0; i < bars.length; i++) {
      var bar = bars[i];
      if (bar.querySelector(".code-expand")) continue; // already injected
      var btn = document.createElement("button");
      btn.className = "code-expand";
      btn.title = "View fullscreen";
      btn.setAttribute("aria-label", "View code fullscreen");
      btn.innerHTML = EXPAND_SVG;
      (function (b, codeEl) {
        b.addEventListener("click", function (e) {
          e.stopPropagation();
          openViewer(codeEl);
        });
      })(btn, bar.closest(".code"));
      bar.appendChild(btn);
    }
  }

  // Watch for DOM changes (React re-renders the #root subtree)
  var mo = new MutationObserver(function () {
    injectExpandButtons();
  });
  mo.observe(document.body, { childList: true, subtree: true });

  // Also run once after initial paint
  window.addEventListener("load", injectExpandButtons);
})();
</script>
</body>

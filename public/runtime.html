<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stagesmith Stage Runtime</title>
<script type="importmap">
{
  "imports": {
    "react": "/api/vendor/react.js?v=__V__",
    "react/jsx-runtime": "/api/vendor/react-jsx-runtime.js?v=__V__",
    "react-dom/client": "/api/vendor/react-dom.js?v=__V__",
    "stagesmith": "/api/vendor/stagesmith.js?v=__V__",
    "lucide-react": "/api/vendor/lucide-react.js?v=__V__"
  }
}
</script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}
  #root{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0}
  .ss-layer{position:absolute;inset:0}
  .ss-bg{z-index:0}
  .ss-content{z-index:1}
  .ss-overlay{z-index:2;pointer-events:none}
  .ss-static *{animation:none !important;transition:none !important}
  #errcard{
    position:absolute;left:40px;top:40px;right:40px;z-index:50;
    background:#14100e;color:#fca5a5;border:1px solid #7f1d1d;border-radius:12px;
    padding:22px 26px;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;
    white-space:pre-wrap;word-break:break-word;pointer-events:none;
  }
  #errcard .err-head{
    color:#f87171;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:11px;margin-bottom:10px;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="errcard" hidden><div class="err-head">Slide error</div><pre id="errmsg" style="margin:0;font:inherit;color:inherit;white-space:inherit"></pre></div>
<script>
/* boot watchdog — reports module load failures back to the parent */
window.__ssErrors = [];
window.addEventListener("error", function (e) {
  window.__ssErrors.push(String(e.message || e.error));
  try { parent.postMessage({ type: "boot-error", frameId: new URLSearchParams(location.search).get("f") || "boot", message: String(e.message || e.error) }, "*"); } catch (err) {}
});
window.addEventListener("unhandledrejection", function (e) {
  var r = e.reason;
  var msg = r && r.message ? r.message : String(r);
  window.__ssErrors.push(msg);
  try { parent.postMessage({ type: "boot-error", frameId: new URLSearchParams(location.search).get("f") || "boot", message: msg }, "*"); } catch (err) {}
});
</script>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import * as stagesmith from "stagesmith";

try { parent.postMessage({ type: "boot-ok", frameId: new URLSearchParams(location.search).get("f") || "boot" }, "*"); } catch (e) {}

// guard against double module execution in the same document
if (window.__ssInstance) {
  // already booted — re-post ready so the parent can re-send its config
  try { parent.postMessage({ type: "ready", frameId: new URLSearchParams(location.search).get("f") || "boot" }, "*"); } catch (e) {}
} else {
  window.__ssInstance = true;

const rootEl = document.getElementById("root");
const root = createRoot(rootEl);
const errCard = document.getElementById("errcard");
const errMsg = document.getElementById("errmsg");

let cfg = null;                 // last render config
const modules = { slide: null, bg: null, overlay: null, commonOverlay: null };
const moduleUrls = { slide: null, bg: null, overlay: null, commonOverlay: null };
let stepsReported = -1;

/* ---------------- helpers ---------------- */

function post(msg) {
  if (!cfg) return;
  try { parent.postMessage({ ...msg, frameId: cfg.frameId }, "*"); } catch (e) { /* ignore */ }
}

function showError(phase, message, stack) {
  errCard.hidden = false;
  errMsg.textContent = (message || "Unknown error") + (stack ? "\n\n" + String(stack).slice(0, 1400) : "");
  post({ type: "error", phase, message: String(message), stack: stack ? String(stack) : undefined });
}

function clearError() {
  if (!errCard.hidden) errCard.hidden = true;
}

async function loadModule(url) {
  // The parent pre-flighted this URL via &meta=1, so import directly.
  return import(url);
}

/* ---------------- image layers (plan §8: image source) ---------------- */

function bgImageLayer(cfgImage) {
  const { url, fit = "cover", position = "center", zoom = 1, blur = 0, dim = 0, opacity = 1 } = cfgImage;
  return React.createElement("div", {
    style: {
      position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none", opacity,
    },
  }, React.createElement("div", {
    style: {
      position: "absolute", inset: 0,
      backgroundImage: `url(${url})`,
      backgroundSize: fit === "contain" ? "contain" : fit === "fill" ? "100% 100%" : "cover",
      backgroundPosition: position,
      filter: blur ? `blur(${blur}px)` : undefined,
      transform: `scale(${zoom})`,
    },
  }), dim ? React.createElement("div", {
    style: { position: "absolute", inset: 0, background: `rgba(0,0,0,${dim})` },
  }) : null);
}

function overlayImageLayer(cfgImage) {
  const { url, x = 0, y = 0, width = 320, rotation = 0, opacity = 1, anchor = "top-left" } = cfgImage;
  const anchors = {
    "top-left": { left: x, top: y },
    "top-right": { right: x, top: y },
    "bottom-left": { left: x, bottom: y },
    "bottom-right": { right: x, bottom: y },
    center: { left: `calc(50% - ${width / 2}px + ${x}px)`, top: `calc(50% + ${y}px)` },
  };
  return React.createElement("img", {
    src: url,
    style: {
      position: "absolute", width, opacity, transform: rotation ? `rotate(${rotation}deg)` : undefined,
      ...(anchors[anchor] || anchors["top-left"]),
    },
  });
}

/* ---------------- React tree ---------------- */

class Boundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error) {
    showError("render", error && error.message ? error.message : String(error), error && error.stack);
  }
  render() {
    if (this.state.error) return null; // error card is plain DOM
    return this.props.children;
  }
}

function Composed() {
  const mode = cfg ? cfg.mode : "dark";
  const show = (cfg && cfg.show) || { bg: true, content: true, overlay: true };
  const bgLayer =
    (modules.bg && React.createElement(modules.bg)) ||
    (cfg && cfg.bgImage && bgImageLayer(cfg.bgImage)) ||
    null;
  const overlayLayer =
    (modules.overlay && React.createElement(modules.overlay)) ||
    (cfg && cfg.overlayImage && overlayImageLayer(cfg.overlayImage)) ||
    null;
  return React.createElement(
    "div",
    { className: "ss-stage", "data-theme": mode },
    [
      bgLayer && show.bg && React.createElement("div", { key: "bg", className: "ss-layer ss-bg" }, bgLayer),
      modules.slide && show.content && React.createElement("div", { key: "content", className: "ss-layer ss-content" }, React.createElement(Boundary, { key: "b" }, React.createElement(modules.slide))),
      overlayLayer && show.overlay && React.createElement("div", { key: "overlay", className: "ss-layer ss-overlay" }, overlayLayer),
    ].filter(Boolean),
  );
}

function renderTree() {
  root.render(React.createElement(Composed));
}

/* ---------------- apply a render config ---------------- */

async function applyConfig(next) {
  const prev = cfg;
  cfg = next;

  // theme css + mode + static + scale always applied
  const styleEl = document.getElementById("theme-style") || (() => {
    const s = document.createElement("style");
    s.id = "theme-style";
    document.head.appendChild(s);
    return s;
  })();
  styleEl.textContent = next.css || "";
  document.documentElement.dataset.theme = next.mode;
  rootEl.dataset.theme = next.mode;
  rootEl.classList.toggle("ss-static", !!next.static);
  rootEl.style.transform = `scale(${next.scale || 1})`;

  stagesmith.initRuntime({
    staticMode: !!next.static,
    mode: next.mode,
    assetBase: next.assetBase || "",
    step: next.static ? 9999 : 0,
    slideIndex: next.slideIndex ?? 0,
    slideTotal: next.slideTotal ?? 0,
    declaredSteps: 1,
  });

  // hot-swap only changed modules (plan §5.1)
  try {
    if (next.bg !== moduleUrls.bg) {
      modules.bg = next.bg ? (await loadModule(next.bg)).default : null;
      moduleUrls.bg = next.bg;
    }
    if (next.commonOverlay !== moduleUrls.commonOverlay) {
      modules.commonOverlay = next.commonOverlay ? (await loadModule(next.commonOverlay)).default : null;
      moduleUrls.commonOverlay = next.commonOverlay;
    }
    if (next.overlay !== moduleUrls.overlay) {
      modules.overlay = next.overlay ? (await loadModule(next.overlay)).default : null;
      moduleUrls.overlay = next.overlay;
    }
    if (next.slide !== moduleUrls.slide) {
      modules.slide = next.slide ? (await loadModule(next.slide)).default : null;
      moduleUrls.slide = next.slide;
    }
  } catch (e) {
    // keep last good modules; show compile/import error (plan: preview keeps last good version)
    showError("import", e.message, e.stack);
    return;
  }

  // when an overlay override is active, <Common/> renders the common one
  stagesmith.__setCommonOverlay(
    next.overlay && next.overlay !== next.commonOverlay ? modules.commonOverlay : null,
  );

  clearError();
  renderTree();

  // report literal step count after paint
  requestAnimationFrame(() => {
    const steps = stagesmith.getState().declaredSteps;
    if (steps !== stepsReported) {
      stepsReported = steps;
      post({ type: "rendered", steps });
    }
  });
}

/* ---------------- messages from parent ---------------- */

window.addEventListener("message", (ev) => {
  const m = ev.data;
  if (!m || typeof m !== "object") return;
  if (m.type === "render") applyConfig(m);
  else if (m.type === "set-step") stagesmith.__setStep(m.step);
  else if (m.type === "set-mode") {
    document.documentElement.dataset.theme = m.mode;
    if (rootEl) rootEl.dataset.theme = m.mode;
    stagesmith.__setMode(m.mode);
    renderTree();
  }
});

window.addEventListener("error", (e) => {
  if (e.error || e.message) showError("runtime", e.message || String(e.error), e.error && e.error.stack);
});
window.addEventListener("unhandledrejection", (e) => {
  const r = e.reason;
  if (r && (r.message || r instanceof Error)) showError("runtime", r.message || String(r), r.stack);
});

/* ready */
const frameParam = new URLSearchParams(location.search).get("f") || "boot";
try {
  parent.postMessage({ type: "ready", frameId: frameParam }, "*");
} catch (e) { /* ignore */ }

} // end __ssInstance guard
</script>
</body>
</html>
